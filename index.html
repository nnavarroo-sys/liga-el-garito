/* ---------- estadísticas ---------- */
function vStatsTab() {
  var h = '<div class="seg" role="tablist" aria-label="Estadísticas">' + [['temporada', 'Temporada'], ['fecha', 'Por fecha']].map(function (x) {
    return '<button class="seg-b' + (ui.st === x[0] ? ' on' : '') + '" role="tab" aria-selected="' + (ui.st === x[0]) + '" data-act="st" data-v="' + x[0] + '">' + x[1] + '</button>';
  }).join('') + '</div>';
  return h + (ui.st === 'fecha' ? vStatsFecha() : vSeason());
}

function vSeason() {
  var S = season(), R = RK.R, h = '';
  if (!S.matches) return empty('Todavía no hay partidos', 'Las estadísticas de la temporada aparecen cuando se cargue el primer resultado.');
  var P = Object.keys(S.players).map(function (k) { return S.players[k]; });
  var best = function (arr, fn) { var b = null; arr.forEach(function (x) { if (b == null || fn(x, b) < 0) b = x; }); return b; };
  var mostW = best(P, function (a, b) { return b.pg - a.pg || a.pj - b.pj; });
  var minPJ = Math.max(6, Math.round(S.matches * 2 / Math.max(1, P.length)));
  var bestPct = best(P.filter(function (x) { return x.pj >= minPJ; }), function (a, b) { return b.pg / b.pj - a.pg / a.pj || b.pj - a.pj; });
  var most60 = best(P, function (a, b) { return b.w60 - a.w60 || b.pg - a.pg; });
  var titles = R.filter(function (e) { return e.wins; }).sort(function (a, b) { return b.wins - a.wins; });
  var topT = titles.length ? titles.filter(function (e) { return e.wins === titles[0].wins; }) : [];
  var tiles = [
    ['Partidos jugados', String(S.matches), plural(S.fechas.length, 'fecha', 'fechas') + ' cargadas partido a partido'],
    ['Más partidos ganados', mostW ? nm(mostW.pid) : '—', mostW ? mostW.pg + ' de ' + mostW.pj + ' (' + pct(mostW.pg, mostW.pj) + ')' : ''],
    ['Mejor % de victorias', bestPct ? nm(bestPct.pid) : '—', bestPct ? pct(bestPct.pg, bestPct.pj) + ' · ' + bestPct.pg + ' de ' + bestPct.pj + ' (mín. ' + minPJ + ' partidos)' : ''],
    ['Más fechas ganadas', topT.length ? topT.map(function (e) { return nm(e.pid); }).join(', ') : '—', topT.length ? plural(topT[0].wins, 'fecha ganada', 'fechas ganadas') + (topT.length > 1 ? ' cada uno' : '') : ''],
    ['Más sets 6–0', most60 && most60.w60 ? nm(most60.pid) : '—', most60 && most60.w60 ? plural(most60.w60, 'set', 'sets') + ' · ' + S.sets60 + ' en total' : ''],
    ['Partidos ajustados', pct(S.close, S.matches), S.close + ' por 1 game o en tie-break · ' + S.tb + ' en tie-break']
  ];
  h += '<div class="hl">' + tiles.map(function (x) { return '<div class="sum"><span class="lab">' + esc(x[0]) + '</span><span class="val">' + esc(x[1]) + '</span><span class="sub">' + esc(x[2]) + '</span></div>'; }).join('') + '</div>';

  /* campeones */
  h += '<h3 class="sec">Campeones de cada fecha</h3><ul class="champs">' + RK.cl.map(function (f) {
    return '<li><button class="chf" data-act="gofecha" data-v="' + f.n + '" data-k="ch' + f.n + '"><b class="n">F' + f.n + '</b><span class="chf-m">' + esc(f.cat) + ' · ' + dd(f.date) + '</span><span class="chf-n">' + winnersOf(f).map(esc).join(' / ') + '</span></button></li>';
  }).join('') + '</ul>';

  /* jugadores */
  var q = norm(ui.sq.trim());
  var rows = P.filter(function (x) { return !q || norm(nm(x.pid)).indexOf(q) >= 0; }).sort(function (a, b) { return b.pg - a.pg || (b.pg / b.pj) - (a.pg / a.pj) || (b.gf - b.gc) - (a.gf - a.gc); });
  var shown = ui.all || q ? rows : rows.slice(0, 20);
  h += '<div class="sec-row"><h3 class="sec">Jugadores</h3><input type="search" id="sq" data-f="ui:sq" placeholder="Buscar jugador" value="' + esc(ui.sq) + '" aria-label="Buscar jugador en las estadísticas"></div>';
  h += '<div class="card"><div class="scroll-x"><table class="st"><thead><tr><th>#</th><th>Jugador</th><th class="r">PJ</th><th class="r">PG</th><th class="r">% gan.</th><th class="r">GF</th><th class="r">GC</th><th class="r">Dif.</th><th class="r">6–0</th><th class="r">Fechas</th></tr></thead><tbody>' +
    shown.map(function (x, i) {
      return '<tr><td class="n">' + (rows.indexOf(x) + 1) + '</td><td><button class="link tl" data-act="goplayer" data-v="' + x.pid + '">' + esc(nm(x.pid)) + '</button></td><td class="r n">' + x.pj + '</td><td class="r n"><b>' + x.pg + '</b></td><td class="r n">' + pct(x.pg, x.pj) + '</td><td class="r n">' + x.gf + '</td><td class="r n">' + x.gc + '</td><td class="r n">' + signed(x.gf - x.gc) + '</td><td class="r n">' + (x.w60 || x.l60 ? (x.w60 ? '<span class="up">+' + x.w60 + '</span>' : '') + (x.w60 && x.l60 ? ' ' : '') + (x.l60 ? '<span class="down">−' + x.l60 + '</span>' : '') : '–') + '</td><td class="r n">' + Object.keys(x.fs).length + '</td></tr>';
    }).join('') + (shown.length ? '' : '<tr><td colspan="10" class="muted">Nadie coincide con “' + esc(ui.sq) + '”.</td></tr>') + '</tbody></table></div></div>';
  if (!q && rows.length > 20) h += '<div class="toolbar"><button class="btn sm" data-act="all">' + (ui.all ? 'Ver solo los 20 primeros' : 'Ver los ' + rows.length + ' jugadores') + '</button></div>';
  h += '<p class="muted small">Ordenados por partidos ganados. Incluye grupos y copas de todas las fechas cargadas partido a partido. 6–0: sets ganados (+) y perdidos (−) por 6–0.</p>';

  /* parejas */
  var pr = Object.keys(S.pairs).map(function (k) { return S.pairs[k]; }).filter(function (x) { return Object.keys(x.fs).length >= 2; });
  pr.forEach(function (x) {
    x.nf = Object.keys(x.fs).length; x.best = null;
    Object.keys(x.fs).forEach(function (n) {
      var f = getF(work, Number(n)), r = f && (f.results || []).find(function (rr) { return rr.p === x.ids[0]; });
      if (r) x.best = x.best == null ? r.pl : Math.min(x.best, r.pl);
    });
  });
  pr.sort(function (a, b) { return b.nf - a.nf || b.pg - a.pg || (a.best || 99) - (b.best || 99); });
  if (pr.length) {
    h += '<h3 class="sec">Parejas que más se repiten</h3><div class="card"><div class="scroll-x"><table class="st pairs"><thead><tr><th>Pareja</th><th class="r">Fechas</th><th class="r">PJ</th><th class="r">PG</th><th class="r">% gan.</th><th class="r">Mejor</th></tr></thead><tbody>' +
      pr.slice(0, 12).map(function (x) {
        return '<tr><td class="gt-p"><span>' + esc(nm(x.ids[0])) + '</span><span>' + esc(nm(x.ids[1])) + '</span></td><td class="r n">' + x.nf + '</td><td class="r n">' + x.pj + '</td><td class="r n"><b>' + x.pg + '</b></td><td class="r n">' + pct(x.pg, x.pj) + '</td><td class="r n">' + (x.best ? x.best + '°' : '–') + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }
  return h;
}

function vStatsFecha() {
  var f = pickFecha();
  if (!f) return empty('Todavía no hay fechas', 'Las estadísticas aparecen cuando se juegue la primera fecha.');
  var h = strip(f.n) + '<section class="fecha" data-k="st-' + f.n + '">' + fechaHead(f);
  if (f.status === 'pendiente') return h + empty('Esta fecha aún no se juega', 'Está programada para el ' + fLong(f.date) + '.') + '</section>';
  if (!isTorneo(f)) return h + empty('Esta fecha no tiene partidos cargados', 'Se cargó solo con la clasificación final, sin el detalle de los partidos.') + '</section>';
  var lc = lcOf(f);
  if (!isReady(f) || !lc.done) return h + empty('Todavía no hay partidos jugados', 'Las estadísticas aparecen cuando se cargue el primer resultado.') + '</section>';
  return h + vStats(f, lc) + '</section>';
}

function orderKey(lc) {
  var key = {};
  for (var pi = 0; pi < lc.F.np; pi++) {
    var pl = lc.places.indexOf(pi), a = lc.assign[pi];
    key[pi] = pl >= 0 ? pl : a ? 100 + a.overall : 1000 + pi;
  }
  return key;
}

function vStats(f, lc) {
  var F = lc.F, st = pairStats(lc), key = orderKey(lc);
  var order = st.slice().sort(function (a, b) { return key[a.pi] - key[b.pi]; });
  var played = st.filter(function (s) { return s.pj; });
  var allM = lc.gm.concat(lc.po).filter(function (m) { return m.w && m.s; });
  var h = '', tiles = [];
  if (lc.places[0] != null) tiles.push(['Campeones', pairText(f, lc.places[0]), 'Copa ORO · ' + st[lc.places[0]].pg + ' de ' + st[lc.places[0]].pj + ' ganados']);
  var bestGF = played.slice().sort(function (a, b) { return b.gf - a.gf || a.pj - b.pj; })[0];
  if (bestGF) tiles.push(['Más games a favor', pairText(f, bestGF.pi), bestGF.gf + ' games en ' + plural(bestGF.pj, 'partido', 'partidos')]);
  var bestD = played.slice().sort(function (a, b) { return a.gc / a.pj - b.gc / b.pj || b.pj - a.pj; })[0];
  if (bestD) tiles.push(['Mejor defensa', pairText(f, bestD.pi), (bestD.gc / bestD.pj).toFixed(1).replace('.', ',') + ' games en contra por partido']);
  var big = allM.slice().sort(function (a, b) { return Math.abs(num(b.s.a) - num(b.s.b)) - Math.abs(num(a.s.a) - num(a.s.b)) || a.r - b.r; })[0];
  if (big) { var wa = big.w === 'a'; tiles.push(['Mayor diferencia', score(wa ? big.s.a : big.s.b, wa ? big.s.b : big.s.a), pairText(f, wa ? big.pa : big.pb) + ' sobre ' + pairText(f, wa ? big.pb : big.pa)]); }
  var climbs = st.filter(function (s) { return lc.seeds && lc.places.indexOf(s.pi) >= 0; }).map(function (s) { return { pi: s.pi, d: lc.origin[s.pi].overall - (lc.places.indexOf(s.pi) + 1) }; }).sort(function (a, b) { return b.d - a.d; });
  if (climbs.length && climbs[0].d > 0) { var c0 = climbs[0]; tiles.push(['Más subió en las copas', pairText(f, c0.pi), 'De ' + lc.origin[c0.pi].overall + '° en la siembra a ' + (lc.places.indexOf(c0.pi) + 1) + '° final']); }
  var close = allM.filter(function (m) { return Math.abs(num(m.s.a) - num(m.s.b)) <= 1; }).length;
  tiles.push(['Partidos ajustados', close + ' de ' + allM.length, 'Se definieron por 1 game o en tie-break']);
  if (tiles.length % 2) tiles.push(['Sets 6–0', String(allM.filter(function (m) { var a = num(m.s.a), b = num(m.s.b); return (a === 6 && b === 0) || (a === 0 && b === 6); }).length), 'Cada uno suma o resta ' + work.settings.bonus60 + ' pts']);
  h += '<h3 class="sec">Destacados</h3><div class="hl">' + tiles.map(function (x) { return '<div class="sum"><span class="lab">' + esc(x[0]) + '</span><span class="val">' + esc(x[1]) + '</span><span class="sub">' + esc(x[2]) + '</span></div>'; }).join('') + '</div>';
  if (lc.seeds) {
    h += '<h3 class="sec">Podio de cada copa</h3><div class="copas' + (F.copas.length === 4 ? ' c4' : '') + '">' + F.copas.map(function (C, ci) {
      return '<div class="card pad"><h3 class="copa-h">' + copaChip(C) + ' Puestos ' + (ci * 4 + 1) + '° a ' + (ci * 4 + 4) + '°</h3><ol class="podio">' + [0, 1, 2].map(function (k) {
        var pi = lc.places[ci * 4 + k];
        return '<li><b class="n">' + (ci * 4 + k + 1) + '°</b><span>' + (pi == null ? '<span class="muted">Por definir</span>' : esc(pairText(f, pi))) + '</span></li>';
      }).join('') + '</ol></div>';
    }).join('') + '</div>';
  }

/* ---------- text exports ---------- */
function headLine(f) { return '🎾 *' + work.league.name + ' · Fecha ' + f.n + ' ' + f.cat + '*'; }

  var lines = ['🎾 *' + work.league.name + ' · ' + work.league.season + '*', 'Ranking tras la Fecha ' + last.n + ' (' + dd(last.date) + ')', ''];
  R.filter(function (e) { return e.pos <= Q; }).forEach(function (e) { lines.push((e.pos <= 3 ? med[e.pos - 1] + ' ' : '') + e.pos + '. ' + nm(e.pid) + ' · ' + e.total); });
  lines.push('', '— Corte Master Final: Top ' + Q + ' —');
  return lines.join('\n');
}
function programText(f) {
  var lc = compute(f), F = lc.F, lines = [headLine(f), cap(fLong(f.date)) + ' · ' + F.np + ' parejas · ' + F.courts + ' canchas', ''];
  F.groups.forEach(function (G, gi) {
    lines.push('*Grupo ' + G + '*');
    [0, 1, 2, 3].forEach(function (si) { lines.push(G + (si + 1) + ' ' + pairText(f, gi * 4 + si)); });
    lines.push('');
  });
  [1, 2, 3].forEach(function (r) {
    lines.push('*Ronda ' + r + ' · ' + rStart(f, r) + '*');
    roundMatches(lc, r).forEach(function (m) { lines.push('Cancha ' + m.court + ': ' + slotName(m.pa) + ' vs ' + slotName(m.pb)); });
    lines.push('');
  });
  lines.push('*Ronda 4 · ' + rStart(f, 4) + '* Semifinales de copa', '*Ronda 5 · ' + rStart(f, 5) + '* Finales y 3er puesto', '', 'Partidos a 1 set de ' + slotOf(f) + ' min. Empate en games: tie-break a 5.');
  return lines.join('\n');
}
function roundText(f, r) {
  var lc = compute(f), lines = [headLine(f), '*Ronda ' + r + ' · ' + rTime(f, r) + '* · ' + roundName(r), ''];
  roundMatches(lc, r).forEach(function (m) {
    var who = m.ready ? slotName(m.pa) + ' ' + pairText(f, m.pa) + ' vs ' + slotName(m.pb) + ' ' + pairText(f, m.pb) : m.la + ' vs ' + m.lb;
    lines.push('Cancha ' + m.court + ' · ' + tagOf(m) + ': ' + who + (m.w ? ' (' + score(m.s.a, m.s.b) + ')' : ''));
  });

}
function crucesText(f) {
  var lc = compute(f), lines = [headLine(f), 'Copas', ''];
  if (!lc.seeds) return lines.concat(['Las copas se arman cuando terminen los grupos.']).join('\n');
  [4, 5].forEach(function (r) {
    lines.push('*Ronda ' + r + ' · ' + rStart(f, r) + (r === 4 ? ' · Semifinales*' : ' · Finales y 3er puesto*'));
    roundMatches(lc, r).forEach(function (m) {
      var who = m.ready ? pairText(f, m.pa) + ' vs ' + pairText(f, m.pb) : m.la + ' vs ' + m.lb;
      lines.push('Cancha ' + m.court + ' · ' + COPA_NAME[m.c] + ' ' + m.label.split(' · ')[0] + ': ' + who + (m.w ? ' (' + score(m.s.a, m.s.b) + ')' : ''));
    });

}
function resultsText(f) {
  var rows = f.status === 'cerrada' || !isTorneo(f) ? (f.results || []) : results(f, work, compute(f));
  var np = npOf(f), by = {}, med = ['🥇', '🥈', '🥉'], lines = [headLine(f), cap(fLong(f.date)), ''], lastC = null;
  rows.forEach(function (r) { (by[r.pl] = by[r.pl] || []).push(r); });
  Object.keys(by).map(Number).sort(function (a, b) { return a - b; }).forEach(function (pl) {
    var C = copaOfPl(np, pl);
    if (C && C !== lastC) { if (lastC) lines.push(''); lines.push('*Copa ' + COPA_NAME[C] + '*'); lastC = C; }
    var rs = by[pl], pts = rs.map(function (r) { return r.b + r.a; });
    lines.push((pl <= 3 ? med[pl - 1] + ' ' : '') + pl + '° ' + rs.map(function (r) { return nm(r.p); }).join(' / ') + ' · ' + (pts.every(function (v) { return v === pts[0]; }) ? pts[0] : pts.join(' / ')) + ' pts');
  });
  return lines.join('\n');
}

    case 'f-reset': clearTorneo(f); f.status = 'pendiente'; delete ui.sub[f.n]; delete ui.rd[f.n]; ui.confirm = null; saveDraft(); break;
    case 'f-reopen': {
      f.status = 'en juego';
      if (isTorneo(f)) ui.sub[f.n] = 'final';
      else { f.mode = 'manual'; f.man = manFromResults(f); }
      ui.confirm = null; saveDraft(); break;
    }
    case 'f-close': {
      var rows = isTorneo(f) ? results(f, work, compute(f)).map(function (r) { return { p: r.p, pl: r.pl, b: r.b, a: r.a, n: r.n }; }) : manualResults(f, work);
      if (!rows.length) { ui.confirm = null; toast('No hay jugadores con puesto para sumar.'); return; }
      f.results = rows; f.status = 'cerrada'; if (!isTorneo(f)) delete f.man;
      ui.confirm = null; saveDraft(); toast('Fecha cerrada. Toca “Guardar y publicar” para actualizar el ranking.'); return;
    }
    case 'tomb-draw': {
      if (Object.keys(f.sc || {}).length) return;
      f.tomb = shuffle(range(1, fmtOf(f).np));
      saveDraft();
      toast(pairsDone(f) === fmtOf(f).np ? 'Tómbola lista. Grupos, partidos y canchas armados.' : 'Números sorteados. Completa las parejas que faltan.');
      return;
    }
    case 'tomb-clear': if (Object.keys(f.sc || {}).length) return; f.tomb = nulls(f.pairs.length); saveDraft(); break;
    case 'tomb-redo': f.sc = {}; f.tomb = nulls(f.pairs.length); ui.confirm = null; saveDraft(); toast('Números y resultados borrados. Vuelve a hacer la tómbola.'); return;
    case 'quick-add': { var qp = addPlayer(ui.quick); if (qp) { ui.quick = ''; toast(qp.name + ' agregado. Ya puedes elegirlo.'); } return; }
    case 'padd': { var p2 = addPlayer(ui.newName, ui.newSide); if (p2) { ui.newName = ''; ui.newSide = ''; toast(p2.name + ' agregado.'); } return; }
    case 'pdel': work.players = work.players.filter(function (p) { return p.id !== ui.player; }); ui.player = null; ui.confirm = null; saveDraft(); break;
    case 'fadd': {
      var fs = fechasSorted(work), lastF = fs[fs.length - 1], d0 = lastF ? pd(lastF.date) : new Date();
      d0.setDate(d0.getDate() + 7);
      work.fechas.push({ n: lastF ? lastF.n + 1 : 1, date: isoD(d0), cat: 'Open', status: 'pendiente' }); saveDraft(); break;
    }
    case 'fdel': work.fechas = work.fechas.filter(function (x) { return !(x.n === Number(v) && x.status === 'pendiente'); }); if (ui.fecha === Number(v)) ui.fecha = null; saveDraft(); break;
  }
  render();
}

function onField(el) {
  var k = el.getAttribute('data-f');
  if (k.indexOf('ui:') === 0) { ui[k.slice(3)] = el.value; render(); return; }
  var f = ui.fecha != null ? getF(work, ui.fecha) : null;
  var val = el.value;
  switch (k) {
    case 'fcat': { var ff = getF(work, Number(el.getAttribute('data-n'))); if (ff && ff.status !== 'cerrada') ff.cat = val; break; }
    case 'cdate': { var fd = getF(work, Number(el.getAttribute('data-n'))); if (fd && /^\d{4}-\d{2}-\d{2}$/.test(val)) fd.date = val; break; }
    case 'pnp': ui.pnp[Number(el.getAttribute('data-n'))] = Number(val); render(); return;
    case 'fstart': if (f && /^\d{2}:\d{2}$/.test(val)) f.start = val; break;
    case 'fslot': if (f && val !== '') f.slot = Math.max(5, Math.round(Number(val)) || 20); break;
    case 'fnp': {
      if (!f || Object.keys(f.sc || {}).length) break;
      var np = Number(val) === 16 ? 16 : 12;
      f.pairs = f.pairs.slice(0, np).concat(emptyPairs(Math.max(0, np - f.pairs.length)));
      f.tomb = nulls(np); f.np = np; break;
    }
    case 'pair': f.pairs[+el.getAttribute('data-i')][+el.getAttribute('data-j')] = val; break;
    case 'tomb': {
      if (!f || Object.keys(f.sc || {}).length) break;
      f.tomb[+el.getAttribute('data-i')] = val ? Number(val) : null;
      saveDraft();
      if (isReady(f)) { toast('Tómbola lista. Grupos, partidos y canchas armados.'); return; }
      break;
    }
    case 'sc': {
      var id = el.getAttribute('data-id'), side = el.getAttribute('data-s'), pa = +el.getAttribute('data-pa'), pb = +el.getAttribute('data-pb');
      f.sc = f.sc || {};
      var s = f.sc[id];
      if (!s || s.pa !== pa || s.pb !== pb) s = f.sc[id] = { pa: pa, pb: pb };
      s[side] = val === '' ? '' : Math.max(0, Math.round(Number(val)));
      if (num(s.a) == null || num(s.a) !== num(s.b)) { delete s.ta; delete s.tb; }
      if (['a', 'b', 'ta', 'tb'].every(function (x) { return s[x] === '' || s[x] == null; })) delete f.sc[id];
      break;
    }
    case 'ex': {
      var ex = f.ex || (f.ex = {}), pid = el.getAttribute('data-pid'), o = ex[pid] || (ex[pid] = {});
      if (el.getAttribute('data-s') === 'v') o.v = val === '' ? '' : Math.round(Number(val)); else o.n = val;
      if ((o.v === '' || o.v == null || o.v === 0) && !o.n) delete ex[pid];
      break;
    }
    case 'np': {
      var M = f.man, n = Number(val);
      if (n > M.rows.length) M.rows = M.rows.concat(mkRows(n).slice(M.rows.length));
      else M.rows = M.rows.slice(0, n);
      M.np = n; break;
    }
    case 'mp': f.man.rows[+el.getAttribute('data-i')].p[+el.getAttribute('data-j')] = val; break;
    case 'ma': f.man.rows[+el.getAttribute('data-i')].a[+el.getAttribute('data-j')] = val === '' ? 0 : Math.round(Number(val)) || 0; break;
    case 'mn': f.man.rows[+el.getAttribute('data-i')].n[+el.getAttribute('data-j')] = val; break;
    case 'pname': { var p = PM.get(el.getAttribute('data-id')); if (p && val.trim()) p.name = val; break; }
    case 'pside': { var p3 = PM.get(el.getAttribute('data-id')); if (p3) p3.side = val; break; }
    case 'set': { var path = el.getAttribute('data-k').split('.'); if (path[1] === 'start' && !/^\d{2}:\d{2}$/.test(val)) return; work[path[0]][path[1]] = val; break; }
    case 'setn': { var path2 = el.getAttribute('data-k').split('.'); if (val !== '') work[path2[0]][path2[1]] = Math.max(0, Math.round(Number(val)) || 0); break; }
    case 'tbl': if (val !== '') work.tables[el.getAttribute('data-c')][+el.getAttribute('data-i')] = Math.max(0, Math.round(Number(val)) || 0); break;
    default: return;
  }
  saveDraft(); render();
}

function save() {
  if (!artifactNS || saving) return;
  saving = true; ui.confirm = null; render();
  try { sessionStorage.setItem(UI_KEY, JSON.stringify(uiPersist())); } catch (e) {}
  var data = JSON.parse(JSON.stringify(work));
  data.updated = new Date().toISOString();
  artifactNS.publish(buildHtml(data)).then(function () {
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    ui.toast = 'Guardado y publicado. Actualizando…'; render();
  }, function (err) {
    saving = false;
    var c = err && err.code;
    if (c === 'conflict') ui.toast = 'Había una versión más nueva y se está cargando. Tus cambios quedan como borrador.';
    else if (c === 'not_writer' || c === 'not_granted' || c === 'not_declared' || c === 'consent_required' || c === 'capability_disabled' || c === 'capability_removed') { canEdit = false; ui.toast = 'Esta vista es de solo lectura: aquí no se pueden guardar cambios.'; }
    else if (c === 'rate_limited') ui.toast = 'Guardaste muy seguido. Espera unos segundos y vuelve a tocar Guardar.';
    else if (c === 'too_large') ui.toast = 'Los datos superan el tamaño permitido para la página.';
    else ui.toast = 'No se pudo guardar. Revisa la conexión y vuelve a intentar.';
    render();
  });
}

function buildHtml(data) {
  var json = JSON.stringify(data).replace(/</g, '\\u003c');
  var fonts = document.getElementById('liga-fonts'), css = document.getElementById('liga-css'), js = document.getElementById('liga-app');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' +
    TITLE + '\n' + (fonts ? fonts.outerHTML + '\n' : '') + css.outerHTML + '\n<div id="app"></div>\n<script type="application/json" id="liga-data">' + json + '</scr' + 'ipt>\n' + js.outerHTML + '</body></html>';
}

/* ---------- rendering ---------- */
var app = document.getElementById('app');
function morphChildren(from, to) {
  var fc = Array.prototype.slice.call(from.childNodes), tc = Array.prototype.slice.call(to.childNodes);
  for (var i = 0; i < tc.length; i++) { if (i < fc.length) morph(fc[i], tc[i]); else from.appendChild(tc[i]); }
  for (var j = tc.length; j < fc.length; j++) fc[j].remove();
}
function morph(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName || (a.nodeType === 1 && (a.getAttribute('data-k') || '') !== (b.getAttribute('data-k') || ''))) { a.replaceWith(b); return; }
  if (a.nodeType !== 1) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  for (var i = a.attributes.length - 1; i >= 0; i--) { var n = a.attributes[i].name; if (!b.hasAttribute(n)) a.removeAttribute(n); }
  for (var k = 0; k < b.attributes.length; k++) { var at = b.attributes[k]; if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value); }
  if (a.nodeName === 'TEXTAREA') { if (a.value !== b.textContent) a.value = b.textContent; return; }
  morphChildren(a, b);
  if (a.nodeName === 'INPUT') { var v = b.getAttribute('value') || ''; if (a !== document.activeElement && a.value !== v) a.value = v; }
  if (a.nodeName === 'SELECT') { var sv = b.getAttribute('data-v') || ''; if (a.value !== sv) a.value = sv; }
}
function centerIn(sel, on) {
  var c = app.querySelector(sel + ' ' + on), s = app.querySelector(sel);
  if (c && s) s.scrollLeft = c.offsetLeft - s.clientWidth / 2 + c.clientWidth / 2;
}
function render() {
  PM = new Map(work.players.map(function (p) { return [p.id, p]; }));
  SORTED = work.players.slice().sort(function (x, y) { return x.name.localeCompare(y.name, 'es'); });
  LCC = new Map(); SS = null;
  var tpl = document.createElement('template');
  tpl.innerHTML = view();
  if (!app.firstChild) app.appendChild(tpl.content);
  else morphChildren(app, tpl.content);
  app.querySelectorAll('select[data-v]').forEach(function (s) { var v = s.getAttribute('data-v'); if (s !== document.activeElement && s.value !== v) s.value = v; });
  if (stripScroll) { stripScroll = false; centerIn('.tabs-in', '.tab.on'); centerIn('.fstrip', '.fchip.sel'); centerIn('.steps', '.step.on'); }
  if (jump) {
    jump = false;
    var st = app.querySelector('.steps');
    if (st) { var y = st.getBoundingClientRect().top + window.scrollY - 64; if (window.scrollY > y) window.scrollTo(0, Math.max(0, y)); }
  }
}

app.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || !app.contains(el) || el.disabled) return;
  act(el.getAttribute('data-act'), el);
});
app.addEventListener('input', function (e) { var el = e.target; if (el.hasAttribute && el.hasAttribute('data-f') && el.tagName === 'INPUT') onField(el); });
app.addEventListener('change', function (e) { var el = e.target; if (el.hasAttribute && el.hasAttribute('data-f') && el.tagName === 'SELECT') onField(el); });
app.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  var id = e.target && e.target.id;
  if (id === 'quick-name') { e.preventDefault(); act('quick-add', e.target); }
  if (id === 'new-name') { e.preventDefault(); act('padd', e.target); }
});

window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || d.type !== 'garito-ins' || e.origin !== insOrigin()) return;
  if (d.h > 0) { insH = Math.ceil(d.h); var fr = document.getElementById('ins-frame'); if (fr) fr.style.height = insH + 'px'; }
  if (d.toast) toast(String(d.toast).slice(0, 200));
  if (d.top) { var f2 = document.getElementById('ins-frame'); if (f2) { var y = f2.getBoundingClientRect().top + window.scrollY - 56; if (window.scrollY > y) window.scrollTo(0, Math.max(0, y)); } }
});
try { if (location.hash === '#inscripcion') ui.tab = 'inscripcion'; } catch (e) {}
render();
if (ui.scroll) { var sy = ui.scroll; delete ui.scroll; requestAnimationFrame(function () { window.scrollTo(0, sy); }); }

try {
  var hot = window.claude && window.claude.hot;
  if (hot) {
    if (typeof hot.snapshot === 'function') hot.snapshot(function () { return { ui: uiPersist() }; });
    var applyHot = function (d) { if (d && d.ui) { Object.assign(ui, d.ui); delete ui.scroll; render(); } };
    if (typeof hot.ready === 'function') hot.ready(applyHot); else applyHot(hot.data);
  }
} catch (e) {}

(function initEdit() {
  try {
    var c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    Promise.all([c.use('artifact'), c.use('user')]).then(function (res) {
      var art = res[0], usr = res[1];
      if (!art || !usr) return null;
      return usr.canEdit().then(function (ok) {
        if (!ok) return;
        artifactNS = art; canEdit = true; loadDraft(); render();
        c.use('downloads').then(function (d) { DL = d || null; render(); }, function () {});
      });
    }).catch(function () {});
  } catch (e) {}
})();
})();
</script>
</body>
