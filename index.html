/* Layout: one mobile-first column (max 980px) under the club's navy band with the official crest; sticky tabs; scoreboard cards for matches. Palette taken from the crest: navy, gold, green */
:root{
  --bg:#eef1f5;--surface:#ffffff;--surface-2:#f4f6fa;--ink:#0b1630;--muted:#55627a;--line:#d5dbe5;--line-strong:#b5bfcf;

  --primary:#0b1d45;--on-primary:#ffffff;
  --accent:#1d3f7a;--accent-soft:#e3e9f4;
  --oro:#8a6400;--oro-soft:#f7ebc2;--plata:#4f5f70;--plata-soft:#e3e8ef;--caca:#6f4220;--caca-soft:#eedfd0;
  --up:#0f7a3c;--down:#b8382a;--warn:#94560a;--warn-soft:#fbefdc;

  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;

}

    --accent:#f5c400;--accent-soft:#2a2410;
    --oro:#ecc04f;--oro-soft:#352b12;--plata:#b6c3cf;--plata-soft:#1f2c42;--caca:#d79c6b;--caca-soft:#36261a;

}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.n{font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.up{color:var(--up)}.down{color:var(--down)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.band-txt{min-width:0}
@media (min-width:720px){.logo{width:124px}.band-in{gap:22px}}
.eyebrow{margin-bottom:6px;font:600 12px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.band h1{font:800 clamp(30px,8vw,52px)/.94 var(--f-display);letter-spacing:.01em;text-transform:uppercase}
.status{margin-top:10px;font-size:14px;color:rgba(255,255,255,.9)}
.status b{color:var(--ball);font-weight:700}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:600 15px/1 var(--f-body);padding:15px 12px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.main{padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}

/* controls */
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:9px 10px;min-width:0}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=search]{flex:1 1 200px}
.btn{appearance:none;font:600 14px/1 var(--f-body);padding:11px 15px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.ball{background:var(--ball);border-color:var(--ball);color:var(--ball-ink)}
.btn.danger{color:var(--down);border-color:currentColor;background:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.link{appearance:none;border:0;background:none;color:var(--accent);font:600 14px var(--f-body);padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600}
.fld input,.fld select{color:var(--ink);font-weight:500}
.fld.inline{flex-direction:row;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.confirm{flex:1 1 100%;background:var(--warn-soft);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm p{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px;display:flex;flex-direction:column;gap:10px}
.gh{font:700 17px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.sec{font:700 19px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin-top:6px}
.note{background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note.warn{background:var(--warn-soft)}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r);padding:24px 16px;text-align:center}
.empty h3{font:700 21px/1.1 var(--f-display);margin-bottom:6px}
.empty p{color:var(--muted)}
.pill{flex:none;font:700 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.p-cerrada,.p-q{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.p-en-juego{background:var(--ball);color:var(--ball-ink);border-color:transparent}
.side{display:inline-block;margin-left:6px;font:700 10px/1 var(--f-body);letter-spacing:.06em;color:var(--muted);border:1px solid var(--line-strong);border-radius:4px;padding:2px 4px;vertical-align:2px}
.copa{font:700 10.5px/1 var(--f-body);letter-spacing:.08em;padding:5px 7px;border-radius:5px;white-space:nowrap}
.c-oro{background:var(--oro-soft);color:var(--oro)}.c-plata{background:var(--plata-soft);color:var(--plata)}.c-caca{background:var(--caca-soft);color:var(--caca)}
.scroll-x{overflow-x:auto}

/* ranking */
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.lab{font:600 10.5px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.val{font:700 19px/1.1 var(--f-display);overflow-wrap:anywhere}
.sum .sub{font-size:12.5px;color:var(--muted);line-height:1.3}
.rk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rk-row{display:grid;grid-template-columns:2.2rem 2.5rem minmax(0,1fr) 2.6rem 3.4rem;align-items:center;gap:6px;width:100%;padding:9px 12px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.rk-head{cursor:default;border-top:0;font:600 10.5px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
button.rk-row:hover{background:var(--surface-2)}
.rk-row .pos{font:700 21px/1 var(--f-display);display:grid;place-items:center;width:2rem;height:2rem}
.rk-row.first .pos{background:var(--ball);color:var(--ball-ink);border-radius:999px}
.mov{font:600 12.5px/1 var(--f-body);text-align:center;color:var(--muted)}
.mov.up{color:var(--up)}.mov.down{color:var(--down)}
.mov.new{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.nf{text-align:right;color:var(--muted)}
.pts{font:700 21px/1 var(--f-display);text-align:right}
.r{text-align:right}
.c-wide{display:none;text-align:right;color:var(--muted)}
@media (min-width:720px){
  .rk-row{grid-template-columns:2.6rem 2.8rem minmax(0,1fr) 4rem 4rem 4rem 3.6rem 4.4rem}
  .c-wide{display:block}
}
.cut{border-top:2px dashed var(--accent);padding:8px 12px;font:700 11.5px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft)}
.rk-det{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 12px 14px;background:var(--surface-2)}
.pf{font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 7px;white-space:nowrap}
.pf b{font-family:var(--f-display);font-size:14px}
.pf i{font-style:normal;font-weight:700}
.pf.off{opacity:.55}

/* fechas */
.fstrip{display:flex;gap:6px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:thin}
.fchip{flex:0 0 auto;width:5rem;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 9px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.fchip b{font:700 19px/1 var(--f-display)}
.fchip span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fchip.st-pendiente{background:transparent;border-style:dashed}
.fchip.st-en-juego{border-color:var(--ball);box-shadow:inset 0 0 0 2px var(--ball)}
.fchip.next{border-color:var(--accent);border-style:solid}
.fchip.st-cerrada b::after{content:" ✓";font-size:13px;color:var(--up)}
.fchip.sel{background:var(--court);border-color:var(--ball);color:#fff}
.fchip.sel span{color:rgba(255,255,255,.82)}
.fchip.sel.st-cerrada b::after{color:var(--ball)}
.fecha{display:flex;flex-direction:column;gap:14px}
.fhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.fhead h2{font:700 28px/1.02 var(--f-display)}
.fhead p{margin-top:4px}
.fcat{color:var(--ink);font-weight:700}
.fmeta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.final{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fin{display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.fin:first-child{border-top:0}
.fin-pl{font:700 23px/1 var(--f-display)}
.fin-pair{display:flex;flex-direction:column;gap:6px;min-width:0}
.fin-p{display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.fin-nm{font-weight:600;flex:1 1 8rem;min-width:0}
.fin-pts{font:700 19px/1 var(--f-display);margin-left:auto}
.fin-note{flex-basis:100%;font-size:12px;color:var(--muted)}
.adj{font:700 12px/1 var(--f-body);padding:3px 5px;border-radius:4px;background:var(--surface-2)}
.seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.seg-b{flex:1 1 0;min-width:0;appearance:none;border:0;background:none;color:var(--muted);font:600 14px/1.1 var(--f-body);padding:8px 4px;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.seg-b i{font-style:normal;font-weight:500;font-size:11.5px;opacity:.85}
.seg-b.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.groups3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}
.pslot{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:8px;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
.ps-id{font:700 17px/1 var(--f-display);color:var(--muted)}
.ps-sel{display:grid;gap:6px}
.ps-sel select{width:100%}
.ps-names{display:flex;flex-direction:column;font-weight:600}
.quick{display:flex;gap:6px;flex:1 1 260px}
.quick input{flex:1 1 auto}
.matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px}
.matches.one{grid-template-columns:1fr}
.match{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mh{display:flex;justify-content:space-between;gap:8px;padding:7px 12px;background:var(--surface-2);font:600 11.5px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sb{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.mh + .sb{border-top:0}
.sb-p{display:flex;flex-direction:column;font-size:14px;line-height:1.25;min-width:0}
.sb.win .sb-p{font-weight:700}
.sb-g{font:700 23px/1 var(--f-display);min-width:2.6rem;text-align:center;border-radius:6px;padding:4px 0}
.sb-tb{font:600 15px/1 var(--f-display);color:var(--muted)}
.ni{width:3.2rem;text-align:center;font:700 21px/1 var(--f-display);padding:7px 4px}
.sb-tb .ni{width:2.9rem;font-size:17px}
.sb.win .sb-g,.sb.win .sb-g .ni{background:var(--ball);color:var(--ball-ink);border-color:var(--ball)}
.mnote{padding:6px 12px 9px;font-size:12.5px;color:var(--muted)}
.mnote.warn{color:var(--warn)}
.gt{width:100%;border-collapse:collapse;font-size:13.5px}
.gt th{font:600 10.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 4px}
.gt th:nth-child(2),.gt td:nth-child(2){text-align:left}
.gt td{padding:7px 4px;border-top:1px solid var(--line);text-align:right;vertical-align:middle}
.gt-p span{display:block;line-height:1.25}
.gt td:first-child{font:700 16px/1 var(--f-display)}
.copas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.copa-b{display:flex;flex-direction:column;gap:8px;min-width:0}
.copa-h{display:flex;align-items:center;gap:8px;font:700 16px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.seeds{list-style:none;margin:0;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;gap:5px;font-size:13.5px}
.seeds li{display:flex;gap:8px}
.seeds b{color:var(--muted);width:1rem;flex:none}
.cl-p{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center}
.cl-calc{font-size:12.5px;color:var(--muted);grid-column:1/-1}
.cl-in{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 5rem;gap:6px}
.cl-in .ni{width:100%;font-size:17px}
.ti{min-width:0;padding:7px 9px}
.man{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:10px}
.man-r{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.man-h{display:flex;justify-content:space-between;align-items:baseline}
.man-h b{font:700 22px/1 var(--f-display)}
.man-p{display:grid;grid-template-columns:minmax(0,1fr) 5rem;gap:6px}
.man-p select{grid-column:1/-1}
.man-p .ni{width:100%;font-size:17px}

/* players */
.plist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pl-row{display:grid;grid-template-columns:minmax(0,1fr) auto 3.4rem;gap:10px;align-items:center;width:100%;padding:11px 12px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.plist li:first-child .pl-row{border-top:0}
button.pl-row:hover{background:var(--surface-2)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row input{flex:1 1 180px}
.ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ph h2{font:800 32px/1 var(--f-display);text-transform:uppercase}
.ph p{margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:720px){.stats{grid-template-columns:repeat(6,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font:700 26px/1.05 var(--f-display)}
.stat span{font-size:12px;color:var(--muted)}
.ht{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
.ht th{font:600 10.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 6px}
.ht td{padding:9px 6px;border-top:1px solid var(--line)}
.ht .r{text-align:right}
.catrow{display:flex;flex-wrap:wrap;gap:8px}

/* settings */
.pt{border-collapse:collapse;font-size:13px;min-width:540px}
.pt th,.pt td{padding:4px;text-align:center;border-top:1px solid var(--line)}
.pt thead th{font:600 10.5px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0;padding-bottom:8px}
.pt tbody th{font:700 15px/1 var(--f-display)}
.pt .ni{width:4.4rem;font-size:16px;padding:6px 4px}
.cal{list-style:none;margin:0;padding:0}
.cal-r{display:grid;grid-template-columns:2.6rem minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding-block:7px;border-top:1px solid var(--line)}
.cal-r:first-child{border-top:0}
.cal-r b{font:700 17px/1 var(--f-display)}
.cal-end{display:flex;gap:6px;align-items:center;justify-content:flex-end}
@media (max-width:560px){.cal-r{grid-template-columns:2.4rem minmax(0,1fr) minmax(0,1fr)}.cal-end{grid-column:2/-1;justify-content:flex-start}}

/* overlays */
.spacer{height:76px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--court);color:#fff;border-top:3px solid var(--ball);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 18px rgba(0,0,0,.18)}
.sb-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;flex-wrap:wrap}
.sb-in span{font-weight:600}
.savebar .btn.ghost{color:#fff;border-color:rgba(255,255,255,.5)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:40;width:max-content;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.22)}
.toast:empty{display:none}
.modal{position:fixed;inset:0;background:rgba(8,16,26,.6);display:grid;place-items:center;padding:16px;z-index:50}
.modal-c{background:var(--surface);border-radius:14px;padding:16px;width:min(560px,100%);display:flex;flex-direction:column;gap:10px}
.modal textarea{width:100%;min-height:240px;font:13px/1.45 ui-monospace,Menlo,monospace;background:var(--surface-2)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
.ins-frame{display:block;width:calc(100% + 32px);margin:-18px -16px 0;border:0;background:var(--bg);min-height:480px}


/* Torneos: additions on top of the Ranking stylesheet (same tokens, same components) */
:root{--carton:#5a5a24;--carton-soft:#ececd2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--carton:#d2d28f;--carton-soft:#292918}}
:root[data-theme="dark"]{--carton:#d2d28f;--carton-soft:#292918}
.c-carton{background:var(--carton-soft);color:var(--carton)}
.groups4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.matches.m4{grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.copas.c4{grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}
.sec-t{font:600 13px/1 var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted);margin-left:6px;white-space:nowrap}
.match.wait{border-style:dashed;background:transparent}
.match.wait .mh{background:transparent}
.gt th,.gt td{padding-inline:3px}
.gt td b{font-weight:700}
.why{font-size:12.5px;color:var(--muted);line-height:1.35}
.seeds li{flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.sd-p{flex:1 1 10rem;min-width:0}
.sd-o{font-size:12px;color:var(--muted);white-space:nowrap}
.fchip.add{border-style:dashed;background:transparent}
.fchip.add b{font-size:21px}
.fchip.add.sel{background:var(--court);border-style:solid}
.fmeta .toolbar{flex:1 1 auto}
.ni.sm{width:3.6rem;font-size:16px;padding:8px 4px}
.prog{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}
.prog th,.prog td{padding:6px 4px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
.prog thead th{border-top:0;font:600 10.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prog tbody th{font:700 16px/1 var(--f-display)}
.prog td:nth-child(2){color:var(--muted)}
.prog-c{text-align:left!important;color:var(--muted)}
.champ{background:var(--court);color:#fff;border-radius:var(--r);border-bottom:3px solid var(--ball);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.champ .lab{color:rgba(255,255,255,.82)}
.champ-n{font:800 clamp(22px,5.5vw,30px)/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.01em;color:var(--ball);text-wrap:balance}
.hl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:720px){.hl{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hl .val{font-size:18px}
.podio{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.podio li{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:6px;align-items:baseline;padding-top:6px;border-top:1px solid var(--line)}
.podio b{font:700 17px/1 var(--f-display)}
.st{width:100%;border-collapse:collapse;font-size:13.5px;min-width:600px}
.st th{font:600 10.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 6px;background:var(--surface-2)}
.st td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
.st .r{text-align:right}
.st td:first-child,.st th:first-child{padding-left:12px}
.st td:last-child,.st th:last-child{padding-right:12px}
.st.rec{min-width:640px}
.rc{display:inline-block;font:600 12.5px/1 var(--f-body);padding:4px 6px;border-radius:5px;white-space:nowrap;background:var(--surface-2);font-variant-numeric:tabular-nums}
.rc.w{color:var(--up)}
.rc.l{color:var(--down)}
.pl-ed{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.plist .pl-ed:first-child{border-top:0}
.quick{min-width:0;max-width:100%}
.quick .btn{flex:none}
/* v2: step flow, courts, brackets */
:root{--pitch:#1f4f8f;--pitch-wall:#143766;--pitch-line:rgba(255,255,255,.55)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pitch:#1b467f;--pitch-wall:#0f2a52}}
:root[data-theme="dark"]{--pitch:#1b467f;--pitch-wall:#0f2a52}
.steps{display:flex;gap:6px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 4px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px/1.1 var(--f-body);cursor:pointer;text-align:left}
.step b{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:999px;background:var(--surface-2);color:var(--muted);font:700 15px/1 var(--f-display)}
.step span{display:flex;flex-direction:column;gap:2px;white-space:nowrap}
.step i{font-style:normal;font-weight:500;font-size:11.5px;color:var(--muted)}
.step.done b{background:var(--accent-soft);color:var(--accent)}
.step.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.step.on b{background:var(--accent);color:var(--on-primary)}
.stepbody{display:flex;flex-direction:column;gap:14px}
.sec-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.sec-row .sec{margin-top:0}
.btns.center{justify-content:center;margin-top:12px}
.rounds .seg-b{padding-inline:2px}
/* registro */
.reg{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.reg-r{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:8px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.reg-i{font:700 19px/1 var(--f-display);color:var(--muted)}
.reg-p{display:grid;gap:6px;min-width:0}
.reg-p select{width:100%}
.reg-names{display:flex;flex-direction:column;font-weight:600;line-height:1.3;min-width:0}
.reg-t{grid-column:2;display:flex;align-items:flex-end;gap:12px}
.reg-t .fld select{width:8.5rem}
.reg-g{display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-left:auto;text-align:right}
.reg-g b{font:700 24px/1 var(--f-display)}
.reg-g i{font-style:normal;font-size:12px;color:var(--muted)}
.reg-num{display:flex;flex-direction:column;gap:3px}
.reg-num b{font:700 22px/1 var(--f-display)}
@media (min-width:720px){
  .reg-r{grid-template-columns:2rem minmax(0,1fr) auto}
  .reg-p{grid-template-columns:1fr 1fr}
  .reg-t{grid-column:auto}
  .reg-r.ro{grid-template-columns:2rem minmax(0,1fr) auto}
}
/* grupos */
.grp-p{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.grp-p li{display:grid;grid-template-columns:2.3rem minmax(0,1fr) auto;gap:8px;align-items:center;padding-top:6px;border-top:1px solid var(--line)}
.grp-p .slot{display:grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:6px;background:var(--surface-2);font:700 16px/1 var(--f-display)}
.grp-n{display:flex;flex-direction:column;font-weight:600;line-height:1.25;min-width:0}
.fx{list-style:none;margin:0;padding:0}
.fx li{display:grid;grid-template-columns:minmax(0,1fr) auto 2.6rem;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.fx-m{font-size:12.5px;color:var(--muted)}
.fx-v{font-size:14px;white-space:nowrap}
.fx-s{font:700 16px/1 var(--f-display);text-align:right}
.pc{display:grid;grid-template-columns:1.9rem minmax(0,1fr);gap:4px;align-items:start}
.pc .slot{font:700 14px/1.3 var(--f-display);color:var(--muted)}
.pn{display:block;min-width:0}
/* canchas */
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px}
.courts.c8{grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.court{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.court.wait{border-style:dashed}
.court-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 12px 0}
.court-h b{font:700 19px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.court-h span{font:600 11.5px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right}
.pitch{position:relative;margin:8px 12px 10px;aspect-ratio:2/1;min-height:128px;background:var(--pitch);border:3px solid var(--pitch-wall);border-radius:4px;display:grid;grid-template-columns:1fr 1fr;color:#fff;overflow:hidden}
.court.wait .pitch{opacity:.72}
.pitch .lines{position:absolute;top:0;bottom:0;left:15.25%;right:15.25%;border-left:2px solid var(--pitch-line);border-right:2px solid var(--pitch-line);background:linear-gradient(var(--pitch-line),var(--pitch-line)) center/100% 2px no-repeat}
.pitch .net{position:absolute;top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px;background:#fff}
.half{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:8px 10px;font-size:13px;line-height:1.2;font-weight:500;min-width:0;overflow-wrap:anywhere;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.half span{display:block}
.half.a{padding-right:38px}
.half.b{padding-left:38px;align-items:flex-end;text-align:right}
.half .slot{font:700 14px/1 var(--f-display);letter-spacing:.04em;color:var(--ball);margin-bottom:4px}
.half.win{font-weight:700}
.half.lose{opacity:.8}
.half .ph{font-style:italic;opacity:.9}
.pg{position:absolute;top:50%;transform:translateY(-50%);min-width:28px;padding:5px 6px;border-radius:6px;background:rgba(255,255,255,.2);font:700 19px/1 var(--f-display);text-align:center;text-shadow:none;color:#fff}
.half.a .pg{right:7px}
.half.b .pg{left:7px}
.pg.w{background:var(--ball);color:var(--ball-ink)}
.pg small{font-size:11px;margin-left:2px}
.court-f{padding:0 12px 10px;margin-top:-2px;font-size:12.5px;color:var(--muted)}
.st.where{min-width:420px}
.st.where.w5{min-width:640px}
.st.where td{white-space:nowrap}
.st.where td.gt-p{white-space:normal;min-width:9rem}
.st.where .cur{background:var(--accent-soft)}
.st.where tr.gsep td{border-top:2px solid var(--line-strong)}
/* tablas */
.gt-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gt td.gt-p{min-width:0}
/* copas */
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:10px}
.tier{padding:12px 12px 6px;display:flex;flex-direction:column;gap:6px}
.tt-c{white-space:nowrap}
.tt-c .n{margin-left:4px;font:700 14px/1 var(--f-display)}
.brk{gap:12px}
.br{display:grid;gap:8px}
.br-link{display:none}
.bm{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.bm.wait{border-style:dashed;background:transparent}
.bm-h{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;background:var(--surface-2);font:600 11px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bm.wait .bm-h{background:transparent}
.bm-r{display:grid;grid-template-columns:1.1rem minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line);font-size:14px;line-height:1.25}
.bm-h + .bm-r{border-top:0}
.bm-sd{font:700 14px/1 var(--f-display);color:var(--muted)}
.bm-slot{font:700 13px/1 var(--f-display);color:var(--muted)}
.bm-g{font:700 19px/1 var(--f-display);min-width:1.9rem;text-align:center;border-radius:5px;padding:3px 4px}
.bm-r.win{font-weight:700}
.bm-r.win .bm-g{background:var(--ball);color:var(--ball-ink)}
.bm-g small{font-size:11px;margin-left:2px}
.br-champ{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-weight:700}
@media (min-width:720px){
  .br{grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);column-gap:0;row-gap:10px}
  .br-semis{grid-column:1;grid-row:1;display:grid;gap:10px}
  .br-link{display:block;grid-column:2;grid-row:1;position:relative}
  .br-link::before{content:"";position:absolute;left:0;width:17px;top:25%;bottom:25%;border:2px solid var(--line-strong);border-left:0;border-radius:0 8px 8px 0}
  .br-link::after{content:"";position:absolute;left:17px;right:0;top:50%;border-top:2px solid var(--line-strong)}
  .br-fin{grid-column:3;grid-row:1;align-self:center}
  .br-third{grid-column:3;grid-row:2}
}
.br-semis{display:grid;gap:8px}
.half{text-shadow:none;align-items:flex-start}
.half .who{display:flex;flex-direction:column;gap:1px;max-width:100%;padding:5px 8px;border-radius:6px;background:rgba(4,14,35,.6)}
.half.b .who{align-items:flex-end}
.half .who span{display:block}
.tier h4{margin:0}
.stepbody h4.lab{margin:4px 0 -4px}
/* Liga unificada: ranking + torneos */
.tab{padding:15px 10px 12px}
button.sum{font:inherit;color:inherit;text-align:left;cursor:pointer}
button.sum:hover,button.pf:hover,.chf:hover{border-color:var(--line-strong)}
button.pf{font:inherit;font-size:12.5px;color:inherit;cursor:pointer}
button.fin-nm{appearance:none;border:0;background:none;padding:0;color:inherit;font:inherit;font-weight:600;text-align:left;cursor:pointer}
button.fin-nm:hover,.link.tl:hover{text-decoration:underline;text-underline-offset:3px}
.link.tl{padding:0;font:inherit;font-weight:600;color:inherit;text-decoration:none;text-align:left}
.ht{min-width:540px}
.ht td .copa{margin-left:4px}
.champs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:8px}
.chf{width:100%;display:grid;grid-template-columns:2.6rem minmax(0,1fr);gap:3px 8px;align-items:baseline;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font:inherit;color:inherit;text-align:left;cursor:pointer}
.chf b{font:700 21px/1 var(--f-display);grid-row:span 2;align-self:center}
.chf-m{font-size:12px;color:var(--muted)}
.chf-n{font-weight:600;line-height:1.3}
.sec-row input[type=search]{flex:0 1 240px}
.st.pairs{min-width:460px}
.st td .link.tl{font-weight:600}
.courts.c8{grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.half{overflow-wrap:break-word}
.ht td .muted.small{display:block}
</style>
</head>

function curRound(lc) { for (var r = 1; r <= 5; r++) { if (roundMatches(lc, r).some(function (m) { return !m.w; })) return r; } return 5; }
function roundOf(f, lc) { var r = ui.rd[f.n]; return r >= 1 && r <= 5 ? r : curRound(lc); }
function tagOf(m) { return m.stage === 'G' ? 'Grupo ' + m.g : COPA_NAME[m.c] + ' · ' + m.label.split(' · ')[0]; }
function roundName(r) { return r <= 3 ? 'Fase de grupos' : r === 4 ? 'Semifinales de copa' : 'Finales y 3er puesto'; }
function stageOf(f, lc) {
  var N = lc.F.np, pdn = pairsDone(f);
  if (f.status === 'cerrada') return 'cerrada';
  if (!isReady(f)) return pdn < N ? 'registro (' + pdn + '/' + N + ' parejas)' : 'falta la tómbola';
  if (!lc.complete) return 'ronda ' + curRound(lc) + ' de 5';
  return 'lista para cerrar';
}
function emptyPairs(n) { return range(1, n).map(function () { return ['', '']; }); }
function nulls(n) { return range(1, n).map(function () { return null; }); }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
function winnersOf(f) { return (f.results || []).filter(function (r) { return r.pl === 1; }).map(function (r) { return nm(r.p); }); }

/* ---------- shell ---------- */
function view() {
  RK = rankInfo();
  var body = ui.tab === 'inscripcion' ? vInscripcion() : ui.tab === 'fechas' ? vFechas() : ui.tab === 'jugadores' ? vPlayers() : ui.tab === 'stats' ? vStatsTab() : (ui.tab === 'ajustes' && canEdit) ? vSettings() : vRanking();
  var dirty = canEdit && isDirty();
  return header() + tabs() + '<main class="wrap main">' + notices() + body + '</main>' +
    '<datalist id="motivos"><option value="Atraso"><option value="Sanción"><option value="Corrección"><option value="No se presentó"></datalist>' +
    (dirty ? '<div class="spacer"></div>' + saveBar() : '') +
    '<div class="toast" role="status" aria-live="polite">' + esc(ui.toast) + '</div>' + copyModal();
}

function header() {
  var fs = fechasSorted(work), cl = fs.filter(function (f) { return f.status === 'cerrada'; });
  var live = fs.filter(function (f) { return f.status === 'en juego'; }), next = fs.find(function (f) { return f.status === 'pendiente'; });
  var st = cl.length + ' de ' + fs.length + ' fechas jugadas';
  if (live.length) { var l = live[live.length - 1]; st += ' · <b>En juego: F' + l.n + ' ' + esc(l.cat) + '</b>' + (isTorneo(l) ? ' · ' + esc(stageOf(l, lcOf(l))) : ''); }
  else if (next) st += ' · Próxima: <b>F' + next.n + ' ' + esc(next.cat) + '</b> · ' + fShort(next.date);
  return '<header class="band"><div class="wrap band-in"><span class="logo" role="img" aria-label="Logo ' + esc(work.league.name) + '"></span><div class="band-txt"><p class="eyebrow">Ranking y torneos</p><h1>' + esc(work.league.season) + '</h1><p class="status">' + st + '</p></div></div></header>';
}

function tabs() {
  var t = [['ranking', 'Ranking'], ['inscripcion', 'Inscripción'], ['fechas', 'Fechas'], ['jugadores', 'Jugadores'], ['stats', 'Estadísticas']];
  if (canEdit) t.push(['ajustes', 'Ajustes']);
  return '<nav class="tabs" aria-label="Secciones"><div class="wrap tabs-in">' + t.map(function (x) {
    return '<button class="tab' + (ui.tab === x[0] ? ' on' : '') + '" data-act="tab" data-v="' + x[0] + '" aria-current="' + (ui.tab === x[0] ? 'page' : 'false') + '">' + x[1] + '</button>';
  }).join('') + '</div></nav>';
}

function vInscripcion() {
  var u = insUrl();
  if (insEmbeddable()) return '<iframe class="ins-frame" id="ins-frame" data-k="ins-frame" title="Inscripción a la próxima fecha" src="' + esc(u + '?embed=1') + '" style="height:' + insH + 'px"></iframe>';
  return '<div class="card pad"><h3 class="gh">Inscripción</h3><p>Los jugadores se anotan a cada fecha en la página de inscripción: 12 titulares y reservas, cupo de campeones y plazo para completar el Partner.</p>' +
    '<div class="btns"><a class="btn primary" href="' + esc(u) + '" target="_blank" rel="noopener">Abrir inscripción</a></div><p class="small muted">' + esc(u) + '</p></div>';
}

function notices() {
  var h = '';
  if (ui.oldDraft && canEdit) h += '<div class="note warn"><span>Tienes cambios sin guardar hechos sobre una versión anterior de la página.</span><button class="btn sm" data-act="draft-restore">Recuperarlos</button><button class="btn sm ghost" data-act="draft-drop">Descartarlos</button></div>';
  if (ui.notice) h += '<div class="note"><span>' + esc(ui.notice) + '</span><button class="link" data-act="notice-x">Entendido</button></div>';
  return h;
}

/* ---------- ranking ---------- */
function mov(e) {
  if (e.mov == null) return e.isNew ? '<span class="mov new">nuevo</span>' : '<span class="mov"></span>';
  if (e.mov > 0) return '<span class="mov up" title="Subió ' + e.mov + '">▲' + e.mov + '</span>';
  if (e.mov < 0) return '<span class="mov down" title="Bajó ' + (-e.mov) + '">▼' + (-e.mov) + '</span>';
  return '<span class="mov" title="Se mantuvo">=</span>';
}

function vRanking() {
  var R = RK.R, last = RK.last, Q = work.settings.qualify;
  if (!R.length) return empty('Todavía no hay fechas cerradas', 'Cuando se cierre la primera fecha, el ranking aparece aquí.');
  var lead = R[0];
  var inQ = R.filter(function (e) { return e.pos <= Q; }), cut = inQ[inQ.length - 1];
  var h = '<section class="summary" aria-label="Resumen">' +
    '<div class="sum"><span class="lab">Líder</span><span class="val">' + esc(nm(lead.pid)) + '</span><span class="sub"><b class="n">' + lead.total + '</b> pts' + (R[1] ? ' · ' + (lead.total - R[1].total) + ' sobre el 2°' : '') + '</span></div>' +
    '<div class="sum"><span class="lab">Corte Top ' + Q + '</span><span class="val n">' + (cut ? cut.total + ' pts' : '—') + '</span><span class="sub">' + (cut ? esc(nm(cut.pid)) + ', ' + cut.pos + '°' : '') + '</span></div>' +
    '<button class="sum sum-b" data-act="gofecha" data-v="' + last.n + '"><span class="lab">Última fecha</span><span class="val">F' + last.n + ' · ' + esc(last.cat) + '</span><span class="sub">Ganaron ' + winnersOf(last).map(esc).join(' y ') + '</span></button></section>';
  h += '<div class="toolbar"><input type="search" id="rk-q" data-f="ui:q" placeholder="Buscar jugador" value="' + esc(ui.q) + '" aria-label="Buscar jugador en el ranking"><button class="btn" data-act="copy-rank">Copiar Top ' + Q + ' para WhatsApp</button></div>';
  var q = norm(ui.q.trim());
  var rows = R.filter(function (e) { return !q || norm(nm(e.pid)).indexOf(q) >= 0; });
  h += '<div class="rk"><div class="rk-row rk-head"><span>Pos</span><span><span class="sr">Movimiento</span></span><span>Jugador</span><span class="c-wide">Prom.</span><span class="c-wide">Mejor</span><span class="c-wide">Podios</span><span class="r">Fechas</span><span class="r">Pts</span></div>';
  var cutShown = false;
  rows.forEach(function (e) {
    if (!q && !cutShown && e.pos > Q) { h += '<div class="cut" data-k="cut">Corte Master Final · clasifican los ' + Q + ' primeros</div>'; cutShown = true; }
    var open = !!ui.open[e.pid];
    h += '<button class="rk-row' + (e.pos === 1 ? ' first' : '') + '" data-k="r-' + e.pid + '" data-act="rk-open" data-v="' + e.pid + '" aria-expanded="' + open + '">' +
      '<span class="pos n">' + e.pos + '</span>' + mov(e) + '<span class="nm">' + esc(nm(e.pid)) + sideChip(e.pid) + '</span>' +
      '<span class="c-wide n">' + Math.round(e.total / e.nf) + '</span><span class="c-wide n">' + e.best + '°</span><span class="c-wide n">' + e.pods + '</span>' +
      '<span class="nf n">' + e.nf + '</span><span class="pts n">' + e.total + '</span></button>';
    if (open) {
      h += '<div class="rk-det" data-k="d-' + e.pid + '">' + RK.cl.map(function (f) {
        var p = e.per[f.n];
        return p ? '<button class="pf" data-act="gofecha" data-v="' + f.n + '"><b>F' + f.n + '</b> ' + p.pl + '° · <span class="n">' + p.pts + '</span>' + (p.a ? ' <i class="' + (p.a > 0 ? 'up' : 'down') + '">' + signed(p.a) + '</i>' : '') + '</button>'
          : '<span class="pf off"><b>F' + f.n + '</b> no jugó</span>';
      }).join('') + '<button class="link" data-act="goplayer" data-v="' + e.pid + '">Ver ficha</button></div>';
    }
  });
  if (!rows.length) h += '<div class="rk-row"><span></span><span></span><span class="muted">Nadie coincide con “' + esc(ui.q) + '”.</span></div>';
  h += '</div><p class="muted small">Los empates en puntos comparten puesto. ▲▼ compara con el ranking antes de la Fecha ' + last.n + '. Toca una fecha para ver su torneo.</p>';
  return h;
}

/* ---------- fechas ---------- */
function pickFecha() {
  var fs = fechasSorted(work);
  if (ui.fecha != null && getF(work, ui.fecha)) return getF(work, ui.fecha);
  var live = fs.filter(function (f) { return f.status === 'en juego'; }), cl = fs.filter(function (f) { return f.status === 'cerrada'; });
  var f = live[live.length - 1] || cl[cl.length - 1] || fs[0];
  ui.fecha = f ? f.n : null;
  return f;
}

function strip(cur) {
  var fs = fechasSorted(work), next = fs.find(function (x) { return x.status === 'pendiente'; });
  return '<div class="fstrip" aria-label="Fechas de la temporada">' + fs.map(function (x) {
    return '<button class="fchip st-' + slug(x.status) + (x.n === cur ? ' sel' : '') + (next && x.n === next.n ? ' next' : '') + '" data-k="fc' + x.n + '" data-act="fecha" data-v="' + x.n + '" aria-pressed="' + (x.n === cur) + '"><b>F' + x.n + '</b><span>' + fDM(x.date) + '</span><span>' + esc(x.cat) + '</span></button>';
  }).join('') + '</div>';
}

function vFechas() {
  var f = pickFecha();
  if (!f) return empty('Todavía no hay fechas', canEdit ? 'Agrégalas en Ajustes → Calendario.' : 'El calendario aparece aquí cuando el organizador lo arme.');
  return strip(f.n) + vFecha(f);
}

function fechaHead(f) {
  var label = { 'cerrada': 'Cerrada', 'en juego': 'En juego', 'pendiente': 'Pendiente' }[f.status], F = fmtOf(f);
  var meta = '<b class="fcat">' + esc(f.cat) + '</b> · ' + cap(fLong(f.date));
  if (isTorneo(f)) meta += ' · ' + F.np + ' parejas · ' + F.courts + ' canchas · desde las ' + esc(f.start);
  if (f.note) meta += ' · ' + esc(f.note);
  return '<div class="fhead"><div><h2>Fecha ' + f.n + '</h2><p class="muted">' + meta + '</p></div><span class="pill p-' + slug(f.status) + '">' + label + '</span></div>';
}

function vFecha(f) {
  var h = '<section class="fecha" data-k="fecha-' + f.n + '">' + fechaHead(f);
  if (f.status === 'pendiente') h += vPending(f);
  else if (isTorneo(f)) h += vTorneo(f);
  else if (f.status === 'cerrada') h += vClosedPlain(f);
  else h += vManual(f);
  return h + '</section>';
}

function vPending(f) {
  if (!canEdit) return empty('Esta fecha aún no se juega', 'Está programada para el ' + fLong(f.date) + '.');
  var np = ui.pnp[f.n] || (f.cat === 'Open Special' ? 16 : 12), F = FMT[np];
  return '<div class="card pad"><div class="grid2"><label class="fld"><span>Categoría</span>' + catSelect(f) + '</label>' +
    '<label class="fld"><span>Formato</span><select id="pnp-' + f.n + '" data-f="pnp" data-n="' + f.n + '" data-v="' + np + '"><option value="12">12 parejas · 3 grupos · 6 canchas</option><option value="16">16 parejas · 4 grupos · 8 canchas</option></select></label></div>' +
    '<p class="muted small">Puntos por jugador (' + esc(f.cat) + '): ' + esc(pointsPreview(f.cat, np)) + '</p>' + tableWarn(f.cat, np) +
    '<p class="muted small">' + F.groups.length + ' grupos de 4 parejas, 3 partidos de grupo por pareja y copas ' + F.copas.map(function (c) { return COPA_NAME[c]; }).join(', ').replace(/, ([^,]+)$/, ' y $1') + ' con semis, final y 3er puesto: 5 rondas desde las ' + esc(work.settings.start) + '.</p>' +
    '<div class="btns"><button class="btn primary" data-act="f-torneo">Armar torneo</button><button class="btn" data-act="f-manual">Cargar puestos directamente</button></div>' +
    '<p class="muted small">“Armar torneo” abre el registro con tómbola, grupos, canchas y resultados partido a partido; al cerrarlo, los puntos pasan solos al ranking. Usa “Cargar puestos directamente” si solo tienes la clasificación final.</p></div>';
}

/* torneo de la fecha, paso a paso */
function defStep(f, lc, edit) {
  if (f.status === 'cerrada') return 'final';
  if (!isReady(f)) return 'registro';
  if (!lc.complete) return edit ? 'resultados' : 'canchas';
  return 'final';
}

function stepNav(f, lc, sub) {
  var N = lc.F.np, ready = isReady(f), closed = f.status === 'cerrada';
  var info = {
    registro: [pairsDone(f) + '/' + N + ' parejas', ready],
    grupos: [ready ? lc.F.groups.join(' · ') : 'tras la tómbola', ready],
    canchas: [ready ? 'Ronda ' + (closed ? 5 : curRound(lc)) : 'tras la tómbola', false],
    resultados: [(lc.done + lc.poDone) + '/' + (lc.gTotal + lc.poTotal), lc.complete],
    tablas: [lc.done + '/' + lc.gTotal + ' partidos', lc.done === lc.gTotal],
    copas: [lc.seeds ? lc.poDone + '/' + lc.poTotal : 'provisoria', lc.complete],
    final: [closed ? 'cerrada' : lc.complete ? 'lista' : '—', closed]
  };
  return '<nav class="steps" aria-label="Pasos del torneo">' + STEPS.map(function (s, i) {
    var x = info[s[0]];
    return '<button class="step' + (sub === s[0] ? ' on' : '') + (x[1] ? ' done' : '') + '" data-k="sp-' + s[0] + '" data-act="sub" data-v="' + s[0] + '" aria-current="' + (sub === s[0] ? 'step' : 'false') + '"><b class="n">' + (x[1] && sub !== s[0] ? '✓' : i + 1) + '</b><span>' + s[1] + '<i>' + esc(x[0]) + '</i></span></button>';
  }).join('') + '</nav>';
}

function vTorneo(f) {
  var lc = lcOf(f), F = lc.F, closed = f.status === 'cerrada', edit = canEdit && !closed;
  var sub = ui.sub[f.n] || defStep(f, lc, edit), h = '';
  if (edit) {
    var hasSc = Object.keys(f.sc || {}).length > 0;
    h += '<div class="fmeta"><div class="toolbar">' +
      '<label class="fld inline"><span>Categoría</span>' + catSelect(f) + '</label>' +
      '<label class="fld inline"><span>Inicio</span><input id="ts-' + f.n + '" type="time" data-f="fstart" value="' + esc(f.start) + '"></label>' +
      '<label class="fld inline"><span>Min. por ronda</span><input id="tl-' + f.n + '" class="ni sm" type="number" inputmode="numeric" min="5" data-f="fslot" value="' + esc(f.slot) + '"></label>' +
      (hasSc ? '' : '<label class="fld inline"><span>Formato</span><select id="tf-' + f.n + '" data-f="fnp" data-v="' + f.np + '"><option value="12">12 parejas</option><option value="16">16 parejas</option></select></label>') +
      '</div>' + (f.results ? '' : confirmBtn('reset-' + f.n, 'Descartar fecha', 'f-reset', 'Se borran las parejas, la tómbola y los resultados, y la fecha queda pendiente.', 'danger sm', 'Sí, descartar')) + '</div>';
    h += tableWarn(f.cat, F.np);
  }
  h += stepNav(f, lc, sub);
  h += '<div class="stepbody" data-k="sb-' + f.n + '-' + sub + '">';
  if (sub === 'registro') h += stRegistro(f, lc, edit);
  else if (sub === 'grupos') h += stGrupos(f, lc);
  else if (sub === 'canchas') h += stCanchas(f, lc);
  else if (sub === 'resultados') h += stResultados(f, lc, edit);
  else if (sub === 'tablas') h += stTablas(f, lc);
  else if (sub === 'copas') h += stCopas(f, lc);
  else h += stFinal(f, lc);
  return h + '</div>';
}

function notReady(f) {
  var N = fmtOf(f).np, pdn = pairsDone(f), S = slotsOf(f);
  var miss = [];
  if (pdn < N) miss.push(plural(N - pdn, 'pareja', 'parejas'));
  if (!S.full) miss.push(plural(N - S.count, 'número de tómbola', 'números de tómbola'));
  return empty('Primero completa el registro', 'Faltan ' + miss.join(' y ') + '. Los grupos, los partidos y las canchas se arman solos cuando las ' + N + ' parejas tengan su número.',
    '<div class="btns center"><button class="btn" data-act="sub" data-v="registro">Ir al registro</button></div>');
}

/* 1 · Registro + tómbola */
function stRegistro(f, lc, edit) {
  var F = lc.F, N = F.np, S = slotsOf(f), hasSc = Object.keys(f.sc || {}).length > 0, ready = isReady(f), pdn = pairsDone(f);
  var used = new Set([].concat.apply([], f.pairs).filter(Boolean));
  var nums = new Set((f.tomb || []).map(Number).filter(function (n) { return n >= 1 && n <= N; }));
  var h = '<div class="summary"><div class="sum"><span class="lab">Parejas</span><span class="val n">' + pdn + ' de ' + N + '</span><span class="sub">' + (pdn < N ? 'Faltan ' + (N - pdn) : 'Completas') + '</span></div>' +
    '<div class="sum"><span class="lab">Tómbola</span><span class="val n">' + S.count + ' de ' + N + '</span><span class="sub">' + (S.full ? 'Números asignados' : 'Números por sortear') + '</span></div>' +
    '<div class="sum"><span class="lab">Grupos</span><span class="val">' + (ready ? 'Listos' : 'Por armar') + '</span><span class="sub">' + (ready ? F.groups.length + ' grupos · ' + lc.gTotal + ' partidos' : 'Se arman con la tómbola') + '</span></div></div>';
  if (edit) {
    h += '<div class="toolbar">';
    if (hasSc) h += confirmBtn('retomb-' + f.n, 'Rehacer tómbola', 'tomb-redo', 'Ya hay resultados cargados. Rehacer la tómbola borra los números y todos los resultados de la fecha.', 'danger', 'Sí, rehacer y borrar');
    else h += '<button class="btn primary" data-act="tomb-draw">' + (S.count ? 'Volver a sortear la tómbola' : 'Sortear tómbola') + '</button>' + (S.count ? '<button class="btn" data-act="tomb-clear">Borrar números</button>' : '');
    h += quickAdd() + '</div>';
    h += '<p class="muted small">Registra las ' + N + ' parejas y toca “Sortear tómbola”, o elige el número que sacó cada pareja si la tómbola se hizo en el club. ' + F.groups.map(function (G, gi) { return 'Del ' + (gi * 4 + 1) + ' al ' + (gi * 4 + 4) + ': Grupo ' + G; }).join(' · ') + '.</p>';
  }
  h += '<ol class="reg">' + f.pairs.map(function (p, i) {
    var n = Number(f.tomb[i]), has = n >= 1 && n <= N, slot = has ? slotName(n - 1) : '';
    var grp = '<span class="reg-g">' + (has ? '<b class="n">' + slot + '</b><i>Grupo ' + slot.charAt(0) + '</i>' : '<i>Sin grupo</i>') + '</span>';
    if (!edit) {
      return '<li class="reg-r ro" data-k="rg' + i + '"><span class="reg-i n">' + (i + 1) + '</span><div class="reg-names">' + (p[0] || p[1] ? '<span>' + esc(p[0] ? nm(p[0]) : '—') + '</span><span>' + esc(p[1] ? nm(p[1]) : '—') + '</span>' : '<span class="muted">Sin registrar</span>') + '</div><div class="reg-t"><span class="reg-num"><span class="lab">N° tómbola</span><b class="n">' + (has ? n : '—') + '</b></span>' + grp + '</div></li>';
    }
    return '<li class="reg-r" data-k="rg' + i + '"><span class="reg-i n">' + (i + 1) + '</span><div class="reg-p">' +
      playerSelect('pp-' + i + '-0', p[0], used, 'pair', 'data-i="' + i + '" data-j="0"') + playerSelect('pp-' + i + '-1', p[1], used, 'pair', 'data-i="' + i + '" data-j="1"') + '</div>' +
      '<div class="reg-t"><label class="fld"><span>N° tómbola</span><select id="tb-' + i + '" data-f="tomb" data-i="' + i + '" data-v="' + (has ? n : '') + '"' + (hasSc ? ' disabled' : '') + '><option value="">—</option>' +
      range(1, N).map(function (k) { var tk = nums.has(k) && k !== n; return '<option value="' + k + '"' + (tk ? ' disabled' : '') + '>' + k + (tk ? ' · ya salió' : '') + '</option>'; }).join('') + '</select></label>' + grp + '</div></li>';
  }).join('') + '</ol>';
  if (ready) h += '<div class="note"><span>Tómbola lista: ' + F.groups.length + ' grupos de 4 y ' + lc.gTotal + ' partidos de grupo armados.</span><button class="btn sm" data-act="sub" data-v="grupos">Ver grupos y partidos</button><button class="btn sm" data-act="sub" data-v="canchas">Ver canchas</button></div>';
  return h;
}

/* 2 · Grupos y partidos */
function stGrupos(f, lc) {
  if (!isReady(f)) return notReady(f);
  var F = lc.F;
  return '<div class="' + (F.np === 16 ? 'groups4' : 'groups3') + '">' + F.groups.map(function (G, gi) {
    var ms = lc.gm.filter(function (m) { return m.g === G; }).sort(function (a, b) { return a.r - b.r || a.court - b.court; });
    return '<div class="card pad" data-k="gr-' + G + '"><h3 class="gh">Grupo ' + G + '</h3><ol class="grp-p">' + [0, 1, 2, 3].map(function (si) {
      var pi = gi * 4 + si;
      return '<li><b class="slot n">' + G + (si + 1) + '</b><span class="grp-n">' + pairLines(f, pi) + '</span><span class="muted small n">N° ' + (pi + 1) + '</span></li>';
    }).join('') + '</ol><h4 class="lab">Partidos</h4><ul class="fx">' + ms.map(function (m) {
      return '<li><span class="fx-m n">R' + m.r + ' · ' + rStart(f, m.r) + ' · Cancha ' + m.court + '</span><span class="fx-v n"><b>' + slotName(m.pa) + '</b> vs <b>' + slotName(m.pb) + '</b></span><span class="fx-s n">' + (m.w ? score(m.s.a, m.s.b) : '–') + '</span></li>';
    }).join('') + '</ul></div>';
  }).join('') + '</div><p class="muted small">Cada pareja juega 3 partidos de grupo: 1 vs 2 y 3 vs 4 en la ronda 1, 1 vs 3 y 2 vs 4 en la ronda 2, 1 vs 4 y 2 vs 3 en la ronda 3. Las canchas rotan para que cada grupo use 2 canchas por ronda.</p>';
}

/* 3 · Canchas */
function roundSel(f, lc, r) {
  return '<div class="seg rounds" role="tablist" aria-label="Rondas">' + [1, 2, 3, 4, 5].map(function (k) {
    var ms = roundMatches(lc, k), dn = ms.filter(function (m) { return m.w; }).length;
    return '<button class="seg-b' + (k === r ? ' on' : '') + '" role="tab" aria-selected="' + (k === r) + '" data-act="rd" data-v="' + k + '">Ronda ' + k + '<i class="n">' + rStart(f, k) + (ms.length && dn === ms.length ? ' ✓' : '') + '</i></button>';
  }).join('') + '</div>';
}
function courtCard(f, lc, m) {
  var ready = m.pa != null && m.pb != null, s = m.s || {}, a = num(s.a), b = num(s.b), tie = a != null && a === b;
  var side = function (k, pi, ph) {
    var g = k === 'a' ? a : b, win = m.w === k;
    var who = '<span class="who">' + (pi == null ? '<span class="ph">' + esc(ph) + '</span>' : '<span class="slot n">' + slotName(pi) + '</span>' + pairLines(f, pi)) + '</span>';
    return '<div class="half ' + k + (win ? ' win' : '') + (m.w && !win ? ' lose' : '') + '">' + who +
      (m.w ? '<span class="pg n' + (win ? ' w' : '') + '">' + g + (tie ? '<small>' + num(s['t' + k]) + '</small>' : '') + '</span>' : '') + '</div>';
  };
  return '<article class="court' + (ready ? '' : ' wait') + '" data-k="ct-' + m.id + (ready ? '' : '-w') + '"><header class="court-h"><b>Cancha ' + m.court + '</b><span>' + esc(tagOf(m)) + '</span></header>' +
    '<div class="pitch"><i class="lines" aria-hidden="true"></i><i class="net" aria-hidden="true"></i>' + side('a', m.pa, m.la) + side('b', m.pb, m.lb) + '</div>' +
    (m.w ? '' : '<p class="court-f">' + (ready ? 'Por jugar' : 'Se define con ' + (m.stage === 'S' ? 'la fase de grupos' : 'las semifinales')) + '</p>') + '</article>';
}
function whereTable(f, lc, cur) {
  var F = lc.F, rounds = lc.seeds ? [1, 2, 3, 4, 5] : [1, 2, 3], by = {};
  lc.gm.concat(lc.po).forEach(function (m) {
    if (m.pa == null || m.pb == null) return;
    [[m.pa, m.pb], [m.pb, m.pa]].forEach(function (x) { (by[x[0]] = by[x[0]] || {})[m.r] = { c: m.court, o: x[1], m: m }; });

    range(0, F.np - 1).map(function (pi) {

        var x = (by[pi] || {})[r];
        var res = x && x.m.w ? '<span class="rc ' + ((x.m.w === 'a') === (x.m.pa === pi) ? 'w">G' : 'l">P') + '</span>' : '';
        return '<td class="' + (r === cur ? 'cur' : '') + '">' + (x ? '<b class="n">C' + x.c + '</b> <span class="muted n">vs ' + slotName(x.o) + '</span> ' + res : '<span class="muted">–</span>') + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table></div></div>';
}
function programCard(f, lc) {
  var F = lc.F;

    [1, 2, 3, 4, 5].map(function (r) {

      return '<tr><th>' + r + '</th><td>' + rStart(f, r) + '</td>' + range(1, F.courts).map(function (c) {
        var m = byC[c];

        return '<td>' + (m.ready ? slotName(m.pa) + '–' + slotName(m.pb) : '<span class="muted">' + COPA_NAME[m.c] + ' ' + (m.stage === 'S' ? 'S' + m.id.slice(-1) : m.stage === 'F' ? 'F' : '3°') + '</span>') + '</td>';
      }).join('') + '</tr>';
    }).join('') +

}
function stCanchas(f, lc) {
  if (!isReady(f)) return notReady(f);

  if (r >= 4 && !lc.seeds) h += '<p class="note">Los cruces de copa se completan solos al terminar la fase de grupos (' + plural(lc.gTotal - lc.done, 'partido pendiente', 'partidos pendientes') + '). Por ahora ves qué cancha usa cada llave.</p>';
  h += '<div class="courts' + (F.courts === 8 ? ' c8' : '') + '">' + ms.map(function (m) { return courtCard(f, lc, m); }).join('') + '</div>';
  h += whereTable(f, lc, r) + programCard(f, lc);

}

/* 4 · Resultados */
function matchCard(f, m, tag, edit) {
  var s = m.s || {}, ga = num(s.a), gb = num(s.b), tie = ga != null && ga === gb;

    return '<div class="sb' + (m.w === k ? ' win' : '') + '"><span class="sb-p">' + who + '</span>' +
      (tie ? '<span class="sb-tb">' + (canIn ? numInput('sc-' + m.id + '-t' + k, tb, attrs('t' + k), 'Tie-break', 'TB') : 'TB ' + (num(tb) == null ? '–' : num(tb))) + '</span>' : '<span></span>') +
      '<span class="sb-g">' + (canIn ? numInput('sc-' + m.id + '-' + k, g, attrs(k), 'Games de ' + (pi == null ? ph : pairText(f, pi))) : (num(g) == null ? '–' : num(g))) + '</span></div>';
  };

function stResultados(f, lc, edit) {

  if (r >= 4 && !lc.seeds) return h + empty('Faltan ' + plural(lc.gTotal - lc.done, 'partido de grupo', 'partidos de grupo'), 'Las semifinales de copa se arman solas cuando estén los ' + lc.gTotal + ' resultados de la fase de grupos.', '<div class="btns center"><button class="btn" data-act="rd" data-v="' + curRound(lc) + '">Ir a la ronda ' + curRound(lc) + '</button></div>');

  if (dn === ms.length) {
    h += '<div class="toolbar">' + (r < 5 ? '<button class="btn primary" data-act="rd" data-v="' + (r + 1) + '">Ir a la ronda ' + (r + 1) + '</button>' : '') +
      (r === 3 ? '<button class="btn" data-act="sub" data-v="copas">Ver clasificación a copas</button>' : r < 3 ? '<button class="btn" data-act="sub" data-v="tablas">Ver tablas</button>' : '') +
      (r === 5 && lc.complete ? '<button class="btn primary" data-act="sub" data-v="final">Ver clasificación final</button>' : '') + '</div>';
  }

}

/* 5 · Tablas de grupo */
var WHY = { h2h: 'define el partido entre ellos (H2H)', gf: 'define games a favor', orden: 'siguen empatados y queda el orden de la tómbola' };

    lc.tables[G].map(function (r) {
      return '<tr><td class="n">' + r.pos + '</td><td class="gt-p">' + pairCell(f, r.pi) + '</td><td class="n">' + r.pj + '</td><td class="n"><b>' + r.pg + '</b></td><td class="n">' + r.pp + '</td><td class="n">' + r.gf + '</td><td class="n">' + r.gc + '</td><td class="n">' + signed(r.dg) + '</td><td class="n">' + r.h2h + '</td></tr>';
    }).join('') + '</tbody></table>' +

}
function stTablas(f, lc) {

    '<p class="muted small">PJ jugados · PG ganados (cada victoria vale 1 punto) · PP perdidos · GF games a favor · GC games en contra · DG diferencia · H2H victorias contra parejas empatadas en PG y DG. Orden: partidos ganados, diferencia de games, H2H y games a favor.</p>';
}

/* 6 · Copas */
var TIER = ['Primeros de grupo', 'Segundos de grupo', 'Terceros de grupo', 'Cuartos de grupo'];
function tierCard(f, lc, k) {

}
function bracket(f, lc, C, ci) {

  h += '<p class="muted small">' + (F.seed === 'mix'
    ? 'ORO: los 3 primeros y el mejor 2°. PLATA: los otros dos 2° y los 2 mejores 3°. CACA: el peor 3° y los tres 4°. Para comparar parejas de distintos grupos: partidos ganados, diferencia de games y menos games en contra.'

/* 7 · Final */
function finalList(f, rows, withInputs) {

  rows.forEach(function (r) { (by[r.pl] = by[r.pl] || []).push(r); });
  return '<ol class="final">' + Object.keys(by).map(Number).sort(function (a, b) { return a - b; }).map(function (pl) {
    return '<li class="fin" data-k="fin' + pl + '"><span class="fin-pl n">' + pl + '°</span><div class="fin-pair">' + by[pl].map(function (r) {
      var ex = (f.ex && f.ex[r.p]) || {};

        (withInputs ? calc + '<div class="cl-in"><input class="ti" id="exn-' + r.p + '" data-f="ex" data-pid="' + r.p + '" data-s="n" list="motivos" value="' + esc(ex.n || '') + '" placeholder="Motivo del ajuste" aria-label="Motivo del ajuste de ' + esc(nm(r.p)) + '"><input class="ni" type="number" inputmode="numeric" id="exv-' + r.p + '" data-f="ex" data-pid="' + r.p + '" data-s="v" value="' + esc(ex.v == null ? '' : ex.v) + '" placeholder="±0" aria-label="Ajuste en puntos de ' + esc(nm(r.p)) + '"></div>'
          : (r.n ? '<span class="fin-note">' + esc(r.n) + '</span>' : '')) + '</div>';
    }).join('') + '</div>' + copaChip(copaOfPl(np, pl)) + '</li>';

function champion(f, lc) {

function closedTools(f, reopenLabel, reopenMsg) {

  h += '</div>';

  return h;
}
function stFinal(f, lc) {
  var S = work.settings, F = lc.F;

    return closedTools(f, 'Reabrir fecha', 'La fecha vuelve a “En juego” para corregir resultados y deja de sumar en el ranking hasta que la cierres de nuevo.') +
      champion(f, lc) + '<p class="muted small">Estos puntos ya suman en el ranking.</p>' + finalList(f, f.results || [], false);

    return empty('Faltan ' + plural(left, 'partido', 'partidos'), 'La clasificación del 1° al ' + F.np + '° se completa cuando terminen las finales y los 3eros puestos de todas las copas.') +
      (part.length ? '<h3 class="sec">Puestos ya definidos</h3>' + finalList(f, part, false) : '');
  }
  var rows = results(f, work, lc);
  var h = champion(f, lc) + '<p class="muted small">Puntos de la tabla ' + esc(f.cat) + ' para cada jugador. Cada set 6–0 ganado suma ' + S.bonus60 + ' y cada 0–6 perdido resta ' + S.bonus60 + ' (tope ' + signed(S.cap * S.bonus60) + ' / ' + signed(-S.cap * S.bonus60) + '). Usa el ajuste para atrasos u otras sanciones.</p>';
  h += finalList(f, rows, canEdit);
  if (canEdit) h += '<div class="toolbar">' + confirmBtn('close-' + f.n, 'Cerrar fecha y sumar al ranking', 'f-close', 'Se suman ' + rows.length + ' jugadores al ranking. Si hay que corregir algo, puedes reabrirla.', 'primary', 'Sí, cerrar y sumar') + '<button class="btn" data-act="copy-res">Copiar resultados para WhatsApp</button></div>';
  return h;
}

/* fecha cargada solo con puestos */
function vClosedPlain(f) {
  return '<p class="note">' + (f.imp ? 'Fecha importada con la clasificación final: guarda puestos y puntos, sin el detalle de los partidos.' : 'Fecha cargada con los puestos directamente, sin el detalle de los partidos.') + '</p>' +
    closedTools(f, 'Editar puestos', 'La fecha vuelve a “En juego” y deja de sumar en el ranking hasta que la cierres de nuevo.') + champion(f, null) + finalList(f, f.results || [], false);
}

function vManual(f) {
  if (!canEdit) return empty('Resultados en carga', 'El organizador está ingresando los puestos de esta fecha.');
  var M = f.man, t = work.tables[f.cat] || [];
  var used = new Set([].concat.apply([], M.rows.map(function (r) { return r.p; })).filter(Boolean));
  var h = '<div class="fmeta"><div class="toolbar"><label class="fld inline"><span>Tabla de puntos</span>' + catSelect(f) + '</label><label class="fld inline"><span>Parejas</span><select id="np-' + f.n + '" data-f="np" data-v="' + M.np + '">' +
    range(4, 16).map(function (n) { return '<option value="' + n + '">' + n + '</option>'; }).join('') + '</select></label></div>' + quickAdd() + '</div>';
  if (M.np > t.length) h += '<p class="note warn">La tabla ' + esc(f.cat) + ' tiene puntos hasta el ' + t.length + '° puesto; los siguientes suman 0. Para 16 parejas usa Open Special.</p>';
  h += '<ol class="man">' + M.rows.map(function (r, i) {
    return '<li class="card man-r" data-k="mr' + r.pl + '"><div class="man-h"><b class="n">' + r.pl + '°</b><span class="muted small">' + (t[r.pl - 1] || 0) + ' pts cada uno</span></div>' + [0, 1].map(function (k) {
      return '<div class="man-p">' + playerSelect('mp-' + i + '-' + k, r.p[k], used, 'mp', 'data-i="' + i + '" data-j="' + k + '"') +
        '<input class="ti" id="mn-' + i + '-' + k + '" data-f="mn" data-i="' + i + '" data-j="' + k + '" list="motivos" value="' + esc(r.n[k] || '') + '" placeholder="Motivo del ajuste" aria-label="Motivo del ajuste">' +
        '<input class="ni" type="number" inputmode="numeric" id="ma-' + i + '-' + k + '" data-f="ma" data-i="' + i + '" data-j="' + k + '" value="' + esc(r.a[k] ? r.a[k] : '') + '" placeholder="±0" aria-label="Ajuste en puntos"></div>';
    }).join('') + '</li>';
  }).join('') + '</ol>';
  var filled = M.rows.reduce(function (s, r) { return s + r.p.filter(Boolean).length; }, 0);

    (f.results ? '' : confirmBtn('reset-' + f.n, 'Descartar fecha', 'f-reset', 'Se borran los puestos cargados y la fecha queda pendiente.', 'danger', 'Sí, descartar')) + '</div>';
  return h;
}

/* ---------- jugadores ---------- */
function playerUsage(pid) {
  return work.fechas.some(function (f) {
    return (f.results || []).some(function (r) { return r.p === pid; }) ||
      (isTorneo(f) && (f.pairs || []).some(function (p) { return p && p.indexOf(pid) >= 0; })) ||
      (f.man && f.man.rows.some(function (r) { return r.p.indexOf(pid) >= 0; }));
  });
}

function vPlayers() {
  if (ui.player && PM.get(ui.player)) return vPlayer(ui.player);
  var rmap = new Map(RK.R.map(function (e) { return [e.pid, e]; }));
  var q = norm(ui.pq.trim());
  var list = SORTED.filter(function (p) { return !q || norm(p.name).indexOf(q) >= 0; });
  var h = '<div class="toolbar"><input type="search" id="pq" data-f="ui:pq" placeholder="Buscar jugador" value="' + esc(ui.pq) + '" aria-label="Buscar jugador"><span class="muted small">' + work.players.length + ' jugadores · ' + RK.R.length + ' con puntos</span></div>';
  if (canEdit) h += '<div class="card pad"><h3 class="gh">Agregar jugador</h3><div class="row"><input id="new-name" data-f="ui:newName" placeholder="Nombre" value="' + esc(ui.newName) + '" aria-label="Nombre"><select id="new-side" data-f="ui:newSide" data-v="' + esc(ui.newSide) + '" aria-label="Lado">' + sideOpts() + '</select><button class="btn primary" data-act="padd">Agregar</button></div></div>';
  h += '<ul class="plist">' + list.map(function (p) {
    var e = rmap.get(p.id);
    return '<li data-k="pl-' + p.id + '"><button class="pl-row" data-act="goplayer" data-v="' + p.id + '"><span class="nm">' + esc(p.name) + sideChip(p.id) + '</span><span class="muted small">' + (e ? e.pos + '° · ' + plural(e.nf, 'fecha', 'fechas') : 'Sin fechas') + '</span><span class="pts n">' + (e ? e.total : '') + '</span></button></li>';
  }).join('') + '</ul>';
  if (!list.length) h += empty('Sin coincidencias', 'Nadie en la lista coincide con “' + ui.pq + '”.');
  return h;
}

function playerFechaRecord(f, pid) {
  if (!isTorneo(f) || !isReady(f)) return null;
  var pi = slotOfPlayer(f, pid);
  if (pi < 0) return null;
  var st = pairStats(lcOf(f))[pi];
  return st.pj ? st : null;
}

function vPlayer(pid) {
  var p = PM.get(pid), e = RK.R.find(function (x) { return x.pid === pid; }), Q = work.settings.qualify;
  var hist = [], cats = {}, mates = {};
  RK.cl.forEach(function (f) {
    var r = f.results.find(function (x) { return x.p === pid; });
    if (!r) return;
    var mate = f.results.find(function (x) { return x.pl === r.pl && x.p !== pid; });
    hist.push({ f: f, r: r, mate: mate, rec: playerFechaRecord(f, pid) });
    var c = cats[f.cat] || (cats[f.cat] = { n: 0, pts: 0 }); c.n++; c.pts += r.b + r.a;
    if (mate) mates[mate.p] = (mates[mate.p] || 0) + 1;
  });
  var ms = season().players[pid];
  var sideTxt = { DR: 'Drive', RV: 'Revés', AM: 'Ambos lados' }[p.side] || '';
  var h = '<button class="link" data-act="pback">← Todos los jugadores</button>';
  h += '<div class="ph"><div><h2>' + esc(p.name) + '</h2><p class="muted">' + (e ? e.pos + '° del ranking · ' + e.total + ' pts' : 'Todavía sin fechas jugadas') + (sideTxt ? ' · ' + sideTxt : '') + '</p></div>' + (e && e.pos <= Q ? '<span class="pill p-q">Clasificando al Master Final</span>' : '') + '</div>';
  if (e) {
    h += '<div class="stats">' + [[e.nf, e.nf === 1 ? 'fecha jugada' : 'fechas jugadas'], [e.wins, e.wins === 1 ? 'fecha ganada' : 'fechas ganadas'], [e.pods, 'podios (1° a 3°)'], [e.best + '°', 'mejor puesto'], [(e.sumPl / e.nf).toFixed(1).replace('.', ',') + '°', 'puesto promedio'], [Math.round(e.total / e.nf), 'pts por fecha']]
      .map(function (s) { return '<div class="stat"><b class="n">' + s[0] + '</b><span>' + s[1] + '</span></div>'; }).join('') + '</div>';
    h += '<div class="catrow">' + Object.keys(cats).map(function (c) { return '<span class="pf"><b>' + esc(c) + '</b> ' + plural(cats[c].n, 'fecha', 'fechas') + ' · <span class="n">' + cats[c].pts + '</span> pts</span>'; }).join('') + '</div>';
  }
  if (ms && ms.pj) {
    h += '<div class="card pad"><h3 class="gh">Partidos de la temporada</h3><div class="stats">' + [[ms.pj, 'jugados'], [ms.pg, 'ganados'], [pct(ms.pg, ms.pj), 'de victorias'], [signed(ms.gf - ms.gc), 'dif. de games'], [ms.w60, 'sets 6–0 ganados'], [ms.l60, 'sets 0–6 perdidos']]
      .map(function (s) { return '<div class="stat"><b class="n">' + s[0] + '</b><span>' + s[1] + '</span></div>'; }).join('') + '</div><p class="muted small n">' + ms.gf + ' games a favor y ' + ms.gc + ' en contra, en grupos y copas de las fechas cargadas partido a partido.</p></div>';
  }
  if (hist.length) {
    h += '<div class="card pad"><h3 class="gh">Historial</h3><div class="scroll-x"><table class="ht"><thead><tr><th>Fecha</th><th>Puesto</th><th>Compañero</th><th>Partidos</th><th class="r">Pts</th></tr></thead><tbody>' +
      hist.map(function (x) {
        var rec = x.rec ? '<span class="rc w">' + x.rec.pg + 'G</span> <span class="rc l">' + x.rec.pp + 'P</span>' : '<span class="muted">–</span>';
        return '<tr><td><button class="link tl" data-act="gofecha" data-v="' + x.f.n + '">F' + x.f.n + '</button> <span class="muted small">' + esc(x.f.cat) + ' · ' + dd(x.f.date) + '</span></td><td class="n">' + x.r.pl + '° ' + copaChip(copaOfPl(npOf(x.f), x.r.pl)) + '</td><td>' + (x.mate ? '<button class="link tl" data-act="goplayer" data-v="' + x.mate.p + '">' + esc(nm(x.mate.p)) + '</button>' : '—') + '</td><td class="n">' + rec + '</td><td class="r n">' + (x.r.b + x.r.a) + (x.r.a ? ' <span class="small ' + (x.r.a > 0 ? 'up' : 'down') + '">(' + signed(x.r.a) + ')</span>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
    var mk = Object.keys(mates).sort(function (a, b) { return mates[b] - mates[a] || nm(a).localeCompare(nm(b), 'es'); });
    if (mk.length) h += '<div class="card pad"><h3 class="gh">Compañeros</h3><div class="catrow">' + mk.map(function (m) { return '<button class="pf" data-act="goplayer" data-v="' + m + '">' + esc(nm(m)) + ' · <b class="n">' + mates[m] + '</b></button>'; }).join('') + '</div></div>';
  }

      (usedP ? '<p class="muted small">Tiene resultados o torneos cargados, así que no se puede eliminar.</p>' : '<div class="toolbar">' + confirmBtn('pdel-' + pid, 'Eliminar jugador', 'pdel', 'Se quita ' + p.name + ' de la lista.', 'danger', 'Sí, eliminar') + '</div>') + '</div>';

  return h;
