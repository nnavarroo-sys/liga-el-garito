/* Layout: one mobile-first column (max 980px) under the club's navy band with the official crest; sticky tabs; scoreboard cards for matches. Palette taken from the crest: navy, gold, green */
:root{
  --bg:#eef1f5;--surface:#ffffff;--surface-2:#f4f6fa;--ink:#0b1630;--muted:#55627a;--line:#d5dbe5;--line-strong:#b5bfcf;

  --primary:#0b1d45;--on-primary:#ffffff;

}

}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.n{font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.up{color:var(--up)}.down{color:var(--down)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.band-txt{min-width:0}
@media (min-width:720px){.logo{width:124px}.band-in{gap:22px}}
.eyebrow{margin-bottom:6px;font:600 12px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.band h1{font:800 clamp(30px,8vw,52px)/.94 var(--f-display);letter-spacing:.01em;text-transform:uppercase}
.status{margin-top:10px;font-size:14px;color:rgba(255,255,255,.9)}
.status b{color:var(--ball);font-weight:700}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:600 15px/1 var(--f-body);padding:15px 12px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.main{padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}

/* controls */
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:9px 10px;min-width:0}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=search]{flex:1 1 200px}
.btn{appearance:none;font:600 14px/1 var(--f-body);padding:11px 15px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.ball{background:var(--ball);border-color:var(--ball);color:var(--ball-ink)}
.btn.danger{color:var(--down);border-color:currentColor;background:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.link{appearance:none;border:0;background:none;color:var(--accent);font:600 14px var(--f-body);padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600}
.fld input,.fld select{color:var(--ink);font-weight:500}
.fld.inline{flex-direction:row;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.confirm{flex:1 1 100%;background:var(--warn-soft);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm p{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px;display:flex;flex-direction:column;gap:10px}
.gh{font:700 17px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.sec{font:700 19px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin-top:6px}
.note{background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note.warn{background:var(--warn-soft)}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r);padding:24px 16px;text-align:center}
.empty h3{font:700 21px/1.1 var(--f-display);margin-bottom:6px}
.empty p{color:var(--muted)}
.pill{flex:none;font:700 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.p-cerrada,.p-q{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.p-en-juego{background:var(--ball);color:var(--ball-ink);border-color:transparent}
.side{display:inline-block;margin-left:6px;font:700 10px/1 var(--f-body);letter-spacing:.06em;color:var(--muted);border:1px solid var(--line-strong);border-radius:4px;padding:2px 4px;vertical-align:2px}
.copa{font:700 10.5px/1 var(--f-body);letter-spacing:.08em;padding:5px 7px;border-radius:5px;white-space:nowrap}
.c-oro{background:var(--oro-soft);color:var(--oro)}.c-plata{background:var(--plata-soft);color:var(--plata)}.c-caca{background:var(--caca-soft);color:var(--caca)}
.scroll-x{overflow-x:auto}

/* ranking */
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.lab{font:600 10.5px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.val{font:700 19px/1.1 var(--f-display);overflow-wrap:anywhere}
.sum .sub{font-size:12.5px;color:var(--muted);line-height:1.3}
.rk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rk-row{display:grid;grid-template-columns:2.2rem 2.5rem minmax(0,1fr) 2.6rem 3.4rem;align-items:center;gap:6px;width:100%;padding:9px 12px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.rk-head{cursor:default;border-top:0;font:600 10.5px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
button.rk-row:hover{background:var(--surface-2)}
.rk-row .pos{font:700 21px/1 var(--f-display);display:grid;place-items:center;width:2rem;height:2rem}
.rk-row.first .pos{background:var(--ball);color:var(--ball-ink);border-radius:999px}
.mov{font:600 12.5px/1 var(--f-body);text-align:center;color:var(--muted)}
.mov.up{color:var(--up)}.mov.down{color:var(--down)}
.mov.new{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.nf{text-align:right;color:var(--muted)}
.pts{font:700 21px/1 var(--f-display);text-align:right}
.r{text-align:right}
.c-wide{display:none;text-align:right;color:var(--muted)}
@media (min-width:720px){
  .rk-row{grid-template-columns:2.6rem 2.8rem minmax(0,1fr) 4rem 4rem 4rem 3.6rem 4.4rem}
  .c-wide{display:block}
}
.cut{border-top:2px dashed var(--accent);padding:8px 12px;font:700 11.5px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft)}
.rk-det{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 12px 14px;background:var(--surface-2)}
.pf{font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 7px;white-space:nowrap}
.pf b{font-family:var(--f-display);font-size:14px}
.pf i{font-style:normal;font-weight:700}
.pf.off{opacity:.55}

/* fechas */
.fstrip{display:flex;gap:6px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:thin}
.fchip{flex:0 0 auto;width:5rem;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 9px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.fchip b{font:700 19px/1 var(--f-display)}
.fchip span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fchip.st-pendiente{background:transparent;border-style:dashed}
.fchip.st-en-juego{border-color:var(--ball);box-shadow:inset 0 0 0 2px var(--ball)}
.fchip.next{border-color:var(--accent);border-style:solid}
.fchip.st-cerrada b::after{content:" ✓";font-size:13px;color:var(--up)}
.fchip.sel{background:var(--court);border-color:var(--ball);color:#fff}
.fchip.sel span{color:rgba(255,255,255,.82)}
.fchip.sel.st-cerrada b::after{color:var(--ball)}
.fecha{display:flex;flex-direction:column;gap:14px}
.fhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.fhead h2{font:700 28px/1.02 var(--f-display)}
.fhead p{margin-top:4px}
.fcat{color:var(--ink);font-weight:700}
.fmeta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.final{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fin{display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.fin:first-child{border-top:0}
.fin-pl{font:700 23px/1 var(--f-display)}
.fin-pair{display:flex;flex-direction:column;gap:6px;min-width:0}
.fin-p{display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.fin-nm{font-weight:600;flex:1 1 8rem;min-width:0}
.fin-pts{font:700 19px/1 var(--f-display);margin-left:auto}
.fin-note{flex-basis:100%;font-size:12px;color:var(--muted)}
.adj{font:700 12px/1 var(--f-body);padding:3px 5px;border-radius:4px;background:var(--surface-2)}
.seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.seg-b{flex:1 1 0;min-width:0;appearance:none;border:0;background:none;color:var(--muted);font:600 14px/1.1 var(--f-body);padding:8px 4px;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.seg-b i{font-style:normal;font-weight:500;font-size:11.5px;opacity:.85}
.seg-b.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.groups3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}
.pslot{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:8px;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
.ps-id{font:700 17px/1 var(--f-display);color:var(--muted)}
.ps-sel{display:grid;gap:6px}
.ps-sel select{width:100%}
.ps-names{display:flex;flex-direction:column;font-weight:600}
.quick{display:flex;gap:6px;flex:1 1 260px}
.quick input{flex:1 1 auto}
.matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px}
.matches.one{grid-template-columns:1fr}
.match{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mh{display:flex;justify-content:space-between;gap:8px;padding:7px 12px;background:var(--surface-2);font:600 11.5px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sb{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.mh + .sb{border-top:0}
.sb-p{display:flex;flex-direction:column;font-size:14px;line-height:1.25;min-width:0}
.sb.win .sb-p{font-weight:700}
.sb-g{font:700 23px/1 var(--f-display);min-width:2.6rem;text-align:center;border-radius:6px;padding:4px 0}
.sb-tb{font:600 15px/1 var(--f-display);color:var(--muted)}
.ni{width:3.2rem;text-align:center;font:700 21px/1 var(--f-display);padding:7px 4px}
.sb-tb .ni{width:2.9rem;font-size:17px}
.sb.win .sb-g,.sb.win .sb-g .ni{background:var(--ball);color:var(--ball-ink);border-color:var(--ball)}
.mnote{padding:6px 12px 9px;font-size:12.5px;color:var(--muted)}
.mnote.warn{color:var(--warn)}
.gt{width:100%;border-collapse:collapse;font-size:13.5px}
.gt th{font:600 10.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 4px}
.gt th:nth-child(2),.gt td:nth-child(2){text-align:left}
.gt td{padding:7px 4px;border-top:1px solid var(--line);text-align:right;vertical-align:middle}
.gt-p span{display:block;line-height:1.25}
.gt td:first-child{font:700 16px/1 var(--f-display)}
.copas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.copa-b{display:flex;flex-direction:column;gap:8px;min-width:0}
.copa-h{display:flex;align-items:center;gap:8px;font:700 16px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.seeds{list-style:none;margin:0;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;gap:5px;font-size:13.5px}
.seeds li{display:flex;gap:8px}
.seeds b{color:var(--muted);width:1rem;flex:none}
.cl-p{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center}
.cl-calc{font-size:12.5px;color:var(--muted);grid-column:1/-1}
.cl-in{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 5rem;gap:6px}
.cl-in .ni{width:100%;font-size:17px}
.ti{min-width:0;padding:7px 9px}
.man{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:10px}
.man-r{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.man-h{display:flex;justify-content:space-between;align-items:baseline}
.man-h b{font:700 22px/1 var(--f-display)}
.man-p{display:grid;grid-template-columns:minmax(0,1fr) 5rem;gap:6px}
.man-p select{grid-column:1/-1}
.man-p .ni{width:100%;font-size:17px}

/* players */
.plist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pl-row{display:grid;grid-template-columns:minmax(0,1fr) auto 3.4rem;gap:10px;align-items:center;width:100%;padding:11px 12px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.plist li:first-child .pl-row{border-top:0}
button.pl-row:hover{background:var(--surface-2)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row input{flex:1 1 180px}
.ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ph h2{font:800 32px/1 var(--f-display);text-transform:uppercase}
.ph p{margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:720px){.stats{grid-template-columns:repeat(6,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font:700 26px/1.05 var(--f-display)}
.stat span{font-size:12px;color:var(--muted)}
.ht{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
.ht th{font:600 10.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 6px}
.ht td{padding:9px 6px;border-top:1px solid var(--line)}
.ht .r{text-align:right}
.catrow{display:flex;flex-wrap:wrap;gap:8px}

/* settings */
.pt{border-collapse:collapse;font-size:13px;min-width:540px}
.pt th,.pt td{padding:4px;text-align:center;border-top:1px solid var(--line)}
.pt thead th{font:600 10.5px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0;padding-bottom:8px}
.pt tbody th{font:700 15px/1 var(--f-display)}
.pt .ni{width:4.4rem;font-size:16px;padding:6px 4px}
.cal{list-style:none;margin:0;padding:0}
.cal-r{display:grid;grid-template-columns:2.6rem minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding-block:7px;border-top:1px solid var(--line)}
.cal-r:first-child{border-top:0}
.cal-r b{font:700 17px/1 var(--f-display)}
.cal-end{display:flex;gap:6px;align-items:center;justify-content:flex-end}
@media (max-width:560px){.cal-r{grid-template-columns:2.4rem minmax(0,1fr) minmax(0,1fr)}.cal-end{grid-column:2/-1;justify-content:flex-start}}

/* overlays */
.spacer{height:76px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--court);color:#fff;border-top:3px solid var(--ball);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 18px rgba(0,0,0,.18)}
.sb-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;flex-wrap:wrap}
.sb-in span{font-weight:600}
.savebar .btn.ghost{color:#fff;border-color:rgba(255,255,255,.5)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:40;width:max-content;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.22)}
.toast:empty{display:none}
.modal{position:fixed;inset:0;background:rgba(8,16,26,.6);display:grid;place-items:center;padding:16px;z-index:50}
.modal-c{background:var(--surface);border-radius:14px;padding:16px;width:min(560px,100%);display:flex;flex-direction:column;gap:10px}
.modal textarea{width:100%;min-height:240px;font:13px/1.45 ui-monospace,Menlo,monospace;background:var(--surface-2)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

        var stale = !!(s && !ok && (num(s.a) != null || num(s.b) != null));
        var m = { id: id, stage: stage, c: C, label: label, court: court, pa: pa, pb: pb, s: ok ? s : null, stale: stale, w: ok ? decide(s) : null };
        out.po.push(m);
        return m;
      };
      var s1 = mk(C + '-S1', 'S', 'Semi 1 · 1° vs 4°', ci * 2 + 1, sd[0], sd[3]);
      var s2 = mk(C + '-S2', 'S', 'Semi 2 · 2° vs 3°', ci * 2 + 2, sd[1], sd[2]);
      if (s1.w && s2.w) {
        var W = function (m) { return m.w === 'a' ? m.pa : m.pb; };
        var Lo = function (m) { return m.w === 'a' ? m.pb : m.pa; };
        var fi = mk(C + '-F', 'F', 'Final · ' + (ci * 4 + 1) + '° y ' + (ci * 4 + 2) + '°', ci * 2 + 1, W(s1), W(s2));
        var th = mk(C + '-3', 'T', '3er puesto · ' + (ci * 4 + 3) + '° y ' + (ci * 4 + 4) + '°', ci * 2 + 2, Lo(s1), Lo(s2));
        if (fi.w) { out.places[ci * 4] = W(fi); out.places[ci * 4 + 1] = Lo(fi); out.finalsDone++; }
        if (th.w) { out.places[ci * 4 + 2] = W(th); out.places[ci * 4 + 3] = Lo(th); out.finalsDone++; }
      }
    });
  }
  out.gm.concat(out.po).forEach(function (m) {
    if (!m.w || !m.s) return;
    var a = num(m.s.a), b = num(m.s.b);
    if (a === 6 && b === 0) { out.net[m.pa] = (out.net[m.pa] || 0) + 1; out.net[m.pb] = (out.net[m.pb] || 0) - 1; }
    if (b === 6 && a === 0) { out.net[m.pb] = (out.net[m.pb] || 0) + 1; out.net[m.pa] = (out.net[m.pa] || 0) - 1; }
  });
  out.complete = out.finalsDone === 6;
  return out;
}

function liveResults(f, d, lc) {

}

  h += finalList(f, f.results || []);
  if (f.mode === 'vivo' && f.live && ui.open['det' + f.n]) {
    var lc = liveCompute(f);
    h += '<h3 class="sec">Tablas de grupo</h3><div class="groups3">' + GROUPS.map(function (G) { return groupTable(f, lc, G); }).join('') + '</div>';
    h += '<h3 class="sec">Copas</h3>' + copasView(f, lc, false);
    h += '<h3 class="sec">Fase de grupos</h3><div class="matches">' + lc.gm.slice().sort(function (a, b) { return a.r - b.r || a.court - b.court; }).map(function (m) { return matchCard(f, m, 'Ronda ' + m.r + ' · Grupo ' + m.g, false); }).join('') + '</div>';
  }
  return h;
}

function vLive(f) {
  var L = f.live, lc = liveCompute(f);
  var pairsDone = L.pairs.filter(function (p) { return p && p[0] && p[1]; }).length;
  var poDone = lc.po.filter(function (m) { return m.w; }).length;
  var def = pairsDone < 12 ? 'parejas' : lc.done < 18 ? 'grupos' : !lc.complete ? 'copas' : 'cierre';
  var sub = ui.sub[f.n] || def;
  var subs = [['parejas', 'Parejas <i>' + pairsDone + '/12</i>'], ['grupos', 'Grupos <i>' + lc.done + '/18</i>'], ['copas', 'Copas <i>' + poDone + '/12</i>'], ['cierre', 'Cierre <i>' + (lc.complete ? 'listo' : '—') + '</i>']];
  var h = '';
  if (canEdit) {
    h += '<div class="fmeta"><label class="fld inline"><span>Categoría</span>' + catSelect(f) + '</label>' +
      (f.results ? '' : confirmBtn('reset-' + f.n, 'Descartar fecha', 'f-reset', 'Se borran las parejas y resultados de esta fecha, y queda pendiente.', 'danger sm', 'Sí, descartar')) + '</div>';
  }
  h += '<div class="seg" role="tablist" aria-label="Etapas de la fecha">' + subs.map(function (s) {
    return '<button class="seg-b' + (sub === s[0] ? ' on' : '') + '" role="tab" aria-selected="' + (sub === s[0]) + '" data-act="sub" data-v="' + s[0] + '">' + s[1] + '</button>';
  }).join('') + '</div>';
  if (sub === 'parejas') h += lvPairs(f);
  else if (sub === 'grupos') h += lvGroups(f, lc);
  else if (sub === 'copas') h += lc.seeds ? copasView(f, lc, canEdit) : empty('Faltan ' + (18 - lc.done) + ' partidos de grupo', 'Las copas se arman solas cuando estén los 18 resultados de la fase de grupos.');
  else h += lvClose(f, lc);
  return h;
}

function lvPairs(f) {
  var L = f.live, used = new Set([].concat.apply([], L.pairs).filter(Boolean));
  var h = '';
  if (canEdit) {
    var hasScores = Object.keys(L.sc).length > 0;
    h += '<div class="toolbar">' + (hasScores ? confirmBtn('draw-' + f.n, 'Sortear grupos', 'draw', 'Ya hay resultados cargados. Volver a sortear los borra.', 'danger', 'Sí, sortear y borrar') : '<button class="btn primary" data-act="draw">Sortear grupos (tómbola)</button>') + quickAdd() + '</div>' +
      '<p class="muted small">Cada grupo toma las parejas en el orden de la lista. Si hiciste la tómbola en el club, ingrésalas directo en su grupo.</p>';
  }
  h += '<div class="groups3">' + GROUPS.map(function (G, gi) {
    return '<div class="card pad"><h3 class="gh">Grupo ' + G + '</h3>' + [0, 1, 2, 3].map(function (si) {
      var i = gi * 4 + si, p = L.pairs[i] || ['', ''];
      return '<div class="pslot" data-k="ps' + i + '"><span class="ps-id">' + G + (si + 1) + '</span>' + (canEdit
        ? '<div class="ps-sel">' + playerSelect('pp-' + i + '-0', p[0], used, 'pair', 'data-i="' + i + '" data-j="0"') + playerSelect('pp-' + i + '-1', p[1], used, 'pair', 'data-i="' + i + '" data-j="1"') + '</div>'
        : '<div class="ps-names">' + pairLines(p, i) + '</div>') + '</div>';
    }).join('') + '</div>';
  }).join('') + '</div>';
  return h;
}

function matchCard(f, m, tag, edit) {
  var L = f.live, s = m.s || {};
  var ga = num(s.a), gb = num(s.b), tie = ga != null && ga === gb;
  var attrs = function (k) { return 'data-f="sc" data-id="' + m.id + '" data-s="' + k + '" data-pa="' + m.pa + '" data-pb="' + m.pb + '"'; };
  var row = function (k, pi) {
    var g = s[k], t = s['t' + k];
    return '<div class="sb' + (m.w === k ? ' win' : '') + '"><span class="sb-p">' + pairLines(L.pairs[pi], pi) + '</span>' +
      (tie ? '<span class="sb-tb">' + (edit ? numInput('sc-' + m.id + '-t' + k, t, attrs('t' + k), 'Tie-break', 'TB') : 'TB ' + (num(t) == null ? '–' : num(t))) + '</span>' : '<span></span>') +
      '<span class="sb-g">' + (edit ? numInput('sc-' + m.id + '-' + k, g, attrs(k), 'Games de ' + pairInline(L.pairs[pi], pi).replace(/&[^;]+;/g, '')) : (num(g) == null ? '–' : num(g))) + '</span></div>';
  };
  return '<article class="match" data-k="m-' + m.id + '"><header class="mh"><span>Cancha ' + m.court + '</span><span>' + esc(tag) + '</span></header>' + row('a', m.pa) + row('b', m.pb) +
    (tie && !m.w && edit ? '<p class="mnote">Empate en games: ingresa el tie-break (a 5, sin diferencia).</p>' : '') +
    (m.stale && edit ? '<p class="mnote warn">Los cruces cambiaron después de cargar este partido. Ingresa el resultado de nuevo.</p>' : '') + '</article>';
}

function groupTable(f, lc, G) {
  return '<div class="card pad"><h3 class="gh">Grupo ' + G + '</h3><table class="gt"><thead><tr><th>#</th><th>Pareja</th><th>PJ</th><th>PG</th><th>DG</th><th>GF</th></tr></thead><tbody>' +
    lc.tables[G].map(function (r) {
      return '<tr><td class="n">' + r.pos + '</td><td class="gt-p">' + pairLines(f.live.pairs[r.pi], r.pi) + '</td><td class="n">' + r.pj + '</td><td class="n">' + r.pg + '</td><td class="n">' + (r.dg > 0 ? '+' : '') + r.dg + '</td><td class="n">' + r.gf + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

function lvGroups(f, lc) {
  var h = '';
  for (var r = 1; r <= 3; r++) {
    var ms = lc.gm.filter(function (m) { return m.r === r; }).sort(function (a, b) { return a.court - b.court; });
    h += '<h3 class="sec">Ronda ' + r + '</h3><div class="matches">' + ms.map(function (m) { return matchCard(f, m, 'Grupo ' + m.g, canEdit); }).join('') + '</div>';
  }
  h += '<h3 class="sec">Tablas de grupo</h3><div class="groups3">' + GROUPS.map(function (G) { return groupTable(f, lc, G); }).join('') + '</div>' +
    '<p class="muted small">Orden en el grupo: partidos ganados, diferencia de games, resultado entre ellos y games a favor. Si empatan en games, tie-break a 5 sin diferencia.</p>';
  return h;
}

function copasView(f, lc, edit) {
  return '<div class="copas">' + COPAS.map(function (C, ci) {
    var ms = lc.po.filter(function (m) { return m.c === C; });
    return '<section class="copa-b"><h3 class="copa-h">' + copaChip(C) + ' Puestos ' + (ci * 4 + 1) + '° a ' + (ci * 4 + 4) + '°</h3>' +
      '<ol class="seeds">' + lc.seeds[C].map(function (pi, k) { return '<li><b class="n">' + (k + 1) + '</b><span>' + pairInline(f.live.pairs[pi], pi) + '</span></li>'; }).join('') + '</ol>' +
      '<div class="matches one">' + ms.map(function (m) { return matchCard(f, m, m.label, edit); }).join('') + '</div>' +
      (ms.length < 4 ? '<p class="muted small">La final y el 3er puesto aparecen cuando terminen las dos semis.</p>' : '') + '</section>';
  }).join('') + '</div>' + (edit ? '<p class="muted small">ORO: los 3 primeros y el mejor 2°. PLATA: los otros 2° y los 2 mejores 3°. CACA: el peor 3° y los 4°. Entre grupos se compara partidos ganados, diferencia de games y menos games en contra.</p>' : '');
}

function lvClose(f, lc) {
  if (!lc.complete) {
    var left = (18 - lc.done) + (12 - lc.po.filter(function (m) { return m.w; }).length);
    return empty('Faltan ' + left + ' partidos', 'El cierre se habilita cuando terminen las finales y los 3eros puestos de las tres copas.');
  }
  var rows = liveResults(f, work, lc), S = work.settings, L = f.live;
  var by = {};
  rows.forEach(function (r) { (by[r.pl] = by[r.pl] || []).push(r); });
  var h = '<p class="muted small">Puntos de la tabla ' + esc(f.cat) + '. Los bonos 6-0 se calculan solos (' + S.bonus60 + ' pts por set, tope ±' + (S.cap * S.bonus60) + '). Usa “Ajuste” para atrasos u otras sanciones.</p>';
  h += '<ol class="final">' + Object.keys(by).map(Number).sort(function (a, b) { return a - b; }).map(function (pl) {
    return '<li class="fin" data-k="cl' + pl + '"><span class="fin-pl n">' + pl + '°</span><div class="fin-pair">' + by[pl].map(function (r) {
      var ex = (L.ex && L.ex[r.p]) || {};
      return '<div class="cl-p"><span class="fin-nm">' + esc(nm(r.p)) + '</span><span class="fin-pts n">' + (r.b + r.a) + '</span>' +
        '<span class="cl-calc">' + r.b + ' por el puesto' + (r.auto ? ' ' + signed(r.auto).replace(/^([+−])/, '$1 ') + ' por 6-0' : '') + (r.ex ? ' ' + signed(r.ex).replace(/^([+−])/, '$1 ') + ' de ajuste' : '') + '</span>' +
        (canEdit ? '<div class="cl-in"><input class="ti" id="exn-' + r.p + '" data-f="ex" data-pid="' + r.p + '" data-s="n" list="motivos" value="' + esc(ex.n || '') + '" placeholder="Motivo del ajuste" aria-label="Motivo del ajuste de ' + esc(nm(r.p)) + '"><input class="ni" type="number" inputmode="numeric" id="exv-' + r.p + '" data-f="ex" data-pid="' + r.p + '" data-s="v" value="' + esc(ex.v == null ? '' : ex.v) + '" placeholder="±0" aria-label="Ajuste en puntos de ' + esc(nm(r.p)) + '"></div>' : '') + '</div>';
    }).join('') + '</div>' + copaChip(copaOf(pl, 12)) + '</li>';
  }).join('') + '</ol>';
  if (canEdit) h += '<div class="toolbar">' + confirmBtn('close-' + f.n, 'Cerrar fecha y sumar al ranking', 'f-close', 'Se suman ' + rows.length + ' jugadores al ranking. Si hay que corregir algo, puedes reabrirla.', 'primary', 'Sí, cerrar y sumar') + '</div>';
  return h;
}

function vManual(f) {
  if (!canEdit) return empty('Resultados en carga', 'El organizador está ingresando los puestos de esta fecha.');
  var M = f.man, t = work.tables[f.cat] || [];
  var used = new Set([].concat.apply([], M.rows.map(function (r) { return r.p; })).filter(Boolean));
  var h = '<div class="fmeta"><label class="fld inline"><span>Tabla de puntos</span>' + catSelect(f) + '</label><label class="fld inline"><span>Parejas</span><select id="np-' + f.n + '" data-f="np" data-v="' + M.np + '">' +
    range(4, 16).map(function (n) { return '<option value="' + n + '">' + n + '</option>'; }).join('') + '</select></label>' + quickAdd() + '</div>';
  if (M.np > t.length) h += '<p class="note warn">La tabla ' + esc(f.cat) + ' tiene puntos hasta el ' + t.length + '° puesto; los siguientes suman 0. Para 16 parejas usa Open Special.</p>';
  h += '<ol class="man">' + M.rows.map(function (r, i) {
    return '<li class="card man-r" data-k="mr' + r.pl + '"><div class="man-h"><b class="n">' + r.pl + '°</b><span class="muted small">' + (t[r.pl - 1] || 0) + ' pts cada uno</span></div>' + [0, 1].map(function (k) {
      return '<div class="man-p">' + playerSelect('mp-' + i + '-' + k, r.p[k], used, 'mp', 'data-i="' + i + '" data-j="' + k + '"') +
        '<input class="ti" id="mn-' + i + '-' + k + '" data-f="mn" data-i="' + i + '" data-j="' + k + '" list="motivos" value="' + esc(r.n[k] || '') + '" placeholder="Motivo del ajuste" aria-label="Motivo del ajuste">' +
        '<input class="ni" type="number" inputmode="numeric" id="ma-' + i + '-' + k + '" data-f="ma" data-i="' + i + '" data-j="' + k + '" value="' + esc(r.a[k] ? r.a[k] : '') + '" placeholder="±0" aria-label="Ajuste en puntos"></div>';
    }).join('') + '</li>';
  }).join('') + '</ol>';
  var filled = M.rows.reduce(function (s, r) { return s + r.p.filter(Boolean).length; }, 0);
  h += '<div class="toolbar">' + confirmBtn('close-' + f.n, 'Cerrar fecha y sumar al ranking', 'f-close', filled + ' jugadores tienen puesto. Se suman al ranking con la tabla ' + f.cat + '.', 'primary', 'Sí, cerrar y sumar') +
    (f.results ? '' : confirmBtn('reset-' + f.n, 'Descartar fecha', 'f-reset', 'Se borran los puestos cargados y la fecha queda pendiente.', 'danger', 'Sí, descartar')) + '</div>';
  return h;
}

function playerUsage(pid) {
  return work.fechas.some(function (f) {
    return (f.results || []).some(function (r) { return r.p === pid; }) ||
      (f.live && f.live.pairs.some(function (p) { return p && p.indexOf(pid) >= 0; })) ||
      (f.man && f.man.rows.some(function (r) { return r.p.indexOf(pid) >= 0; }));
  });
}

function vPlayers() {
  if (ui.player && PM.get(ui.player)) return vPlayer(ui.player);
  var rmap = new Map(RK.R.map(function (e) { return [e.pid, e]; }));
  var q = norm(ui.pq.trim());
  var list = SORTED.filter(function (p) { return !q || norm(p.name).indexOf(q) >= 0; });
  var h = '<div class="toolbar"><input type="search" id="pq" data-f="ui:pq" placeholder="Buscar jugador" value="' + esc(ui.pq) + '" aria-label="Buscar jugador"><span class="muted small">' + work.players.length + ' jugadores · ' + RK.R.length + ' con puntos</span></div>';
  if (canEdit) h += '<div class="card pad"><h3 class="gh">Agregar jugador</h3><div class="row"><input id="new-name" data-f="ui:newName" placeholder="Nombre" value="' + esc(ui.newName) + '" aria-label="Nombre"><select id="new-side" data-f="ui:newSide" data-v="' + esc(ui.newSide) + '" aria-label="Lado">' + sideOpts() + '</select><button class="btn primary" data-act="padd">Agregar</button></div></div>';
  h += '<ul class="plist">' + list.map(function (p) {
    var e = rmap.get(p.id);
    return '<li data-k="pl-' + p.id + '"><button class="pl-row" data-act="goplayer" data-v="' + p.id + '"><span class="nm">' + esc(p.name) + sideChip(p.id) + '</span><span class="muted small">' + (e ? e.pos + '° · ' + e.nf + (e.nf === 1 ? ' fecha' : ' fechas') : 'Sin fechas') + '</span><span class="pts n">' + (e ? e.total : '') + '</span></button></li>';
  }).join('') + '</ul>';
  if (!list.length) h += empty('Sin coincidencias', 'Nadie en la lista coincide con “' + ui.pq + '”.');
  return h;
}

function vPlayer(pid) {
  var p = PM.get(pid), e = RK.R.find(function (x) { return x.pid === pid; }), Q = work.settings.qualify;
  var hist = [], cats = {};
  RK.cl.forEach(function (f) {
    var r = f.results.find(function (x) { return x.p === pid; });
    if (!r) return;
    var mate = f.results.find(function (x) { return x.pl === r.pl && x.p !== pid; });
    hist.push({ f: f, r: r, mate: mate });
    var c = cats[f.cat] || (cats[f.cat] = { n: 0, pts: 0 }); c.n++; c.pts += r.b + r.a;
  });
  var pj = 0, pg = 0, gf = 0, gc = 0;
  fechasSorted(work).forEach(function (f) {
    if (f.mode !== 'vivo' || !f.live) return;
    var pi = f.live.pairs.findIndex(function (pp) { return pp && pp.indexOf(pid) >= 0; });
    if (pi < 0) return;
    var lc = liveCompute(f);
    lc.gm.concat(lc.po).forEach(function (m) {
      if (!m.w || !m.s || (m.pa !== pi && m.pb !== pi)) return;
      var isA = m.pa === pi; pj++;
      if ((m.w === 'a') === isA) pg++;
      gf += isA ? num(m.s.a) : num(m.s.b); gc += isA ? num(m.s.b) : num(m.s.a);
    });
  });
  var sideTxt = { DR: 'Drive', RV: 'Revés', AM: 'Ambos lados' }[p.side] || '';
  var h = '<button class="link" data-act="pback">← Todos los jugadores</button>';
  h += '<div class="ph"><div><h2>' + esc(p.name) + '</h2><p class="muted">' + (e ? e.pos + '° del ranking · ' + e.total + ' pts' : 'Todavía sin fechas jugadas') + (sideTxt ? ' · ' + sideTxt : '') + '</p></div>' + (e && e.pos <= Q ? '<span class="pill p-q">Clasificando al Master Final</span>' : '') + '</div>';
  if (e) {
    h += '<div class="stats">' + [[e.nf, e.nf === 1 ? 'fecha jugada' : 'fechas jugadas'], [e.wins, e.wins === 1 ? 'fecha ganada' : 'fechas ganadas'], [e.pods, 'podios (1° a 3°)'], [e.best + '°', 'mejor puesto'], [(e.sumPl / e.nf).toFixed(1).replace('.', ',') + '°', 'puesto promedio'], [Math.round(e.total / e.nf), 'pts por fecha']]
      .map(function (s) { return '<div class="stat"><b class="n">' + s[0] + '</b><span>' + s[1] + '</span></div>'; }).join('') + '</div>';
    h += '<div class="catrow">' + Object.keys(cats).map(function (c) { return '<span class="pf"><b>' + esc(c) + '</b> ' + cats[c].n + (cats[c].n === 1 ? ' fecha' : ' fechas') + ' · <span class="n">' + cats[c].pts + '</span> pts</span>'; }).join('') + '</div>';
    if (pj) h += '<div class="card pad"><h3 class="gh">Partidos</h3><p class="n">' + pj + ' jugados · ' + pg + ' ganados (' + Math.round(pg * 100 / pj) + '%) · ' + gf + ' games a favor y ' + gc + ' en contra</p><p class="muted small">Solo fechas cargadas partido a partido en la app.</p></div>';
    h += '<div class="card pad"><h3 class="gh">Historial</h3><div class="scroll-x"><table class="ht"><thead><tr><th>Fecha</th><th>Puesto</th><th>Compañero</th><th class="r">Pts</th></tr></thead><tbody>' +
      hist.map(function (x) { return '<tr><td><b>F' + x.f.n + '</b> <span class="muted small">' + esc(x.f.cat) + ' · ' + dd(x.f.date) + '</span></td><td class="n">' + x.r.pl + '°</td><td>' + (x.mate ? esc(nm(x.mate.p)) : '—') + '</td><td class="r n">' + (x.r.b + x.r.a) + (x.r.a ? ' <span class="small ' + (x.r.a > 0 ? 'up' : 'down') + '">(' + signed(x.r.a) + ')</span>' : '') + '</td></tr>'; }).join('') +
      '</tbody></table></div></div>';
  }
  if (canEdit) {
    var usedP = playerUsage(pid);
    h += '<div class="card pad"><h3 class="gh">Editar jugador</h3><div class="grid2"><label class="fld"><span>Nombre</span><input id="pn-' + pid + '" data-f="pname" data-id="' + pid + '" value="' + esc(p.name) + '"></label><label class="fld"><span>Lado</span><select id="ps-' + pid + '" data-f="pside" data-id="' + pid + '" data-v="' + esc(p.side || '') + '">' + sideOpts() + '</select></label></div>' +
      (usedP ? '<p class="muted small">Tiene resultados cargados, así que no se puede eliminar.</p>' : '<div class="toolbar">' + confirmBtn('pdel-' + pid, 'Eliminar jugador', 'pdel', 'Se quita ' + p.name + ' de la lista.', 'danger', 'Sí, eliminar') + '</div>') + '</div>';
  }
  return h;
}

function vSettings() {
  var d = work, S = d.settings, maxPos = Math.max.apply(null, d.cats.map(function (c) { return d.tables[c].length; }));
  var h = '<div class="card pad"><h3 class="gh">Liga</h3><div class="grid2"><label class="fld"><span>Nombre</span><input id="s-name" data-f="set" data-k="league.name" value="' + esc(d.league.name) + '"></label><label class="fld"><span>Temporada</span><input id="s-season" data-f="set" data-k="league.season" value="' + esc(d.league.season) + '"></label></div></div>';
  h += '<div class="card pad"><h3 class="gh">Bonos y clasificación</h3><div class="grid3">' +
    '<label class="fld"><span>Puntos por set 6-0</span><input type="number" inputmode="numeric" id="s-b60" data-f="setn" data-k="settings.bonus60" value="' + S.bonus60 + '"></label>' +
    '<label class="fld"><span>Tope de sets 6-0 por fecha</span><input type="number" inputmode="numeric" id="s-cap" data-f="setn" data-k="settings.cap" value="' + S.cap + '"></label>' +
    '<label class="fld"><span>Clasifican al Master Final</span><input type="number" inputmode="numeric" id="s-q" data-f="setn" data-k="settings.qualify" value="' + S.qualify + '"></label></div>' +
    '<p class="muted small">Cada set ganado 6-0 suma y cada set perdido 0-6 resta, en todas las rondas. Con ' + S.bonus60 + ' pts y tope ' + S.cap + ', el ajuste va de ' + signed(-S.cap * S.bonus60) + ' a ' + signed(S.cap * S.bonus60) + ' por fecha.</p></div>';
  h += '<div class="card pad"><h3 class="gh">Puntos por puesto</h3><div class="scroll-x"><table class="pt"><thead><tr><th>Puesto</th>' + d.cats.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    range(1, maxPos).map(function (pos) {
      return '<tr><th>' + pos + '°</th>' + d.cats.map(function (c) {
        var t = d.tables[c];
        return pos <= t.length ? '<td><input class="ni" type="number" inputmode="numeric" id="t-' + slug(c) + '-' + pos + '" data-f="tbl" data-c="' + esc(c) + '" data-i="' + (pos - 1) + '" value="' + t[pos - 1] + '" aria-label="' + esc(c) + ', ' + pos + '° puesto"></td>' : '<td class="muted">—</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table></div><p class="muted small">Los cambios aplican a las fechas que cierres desde ahora. Las fechas ya cerradas conservan sus puntos.</p></div>';
  h += '<div class="card pad"><h3 class="gh">Calendario</h3><ul class="cal">' + fechasSorted(d).map(function (f) {

function fechaText(f) {

  var lines = ['🎾 *' + work.league.name + ' · Fecha ' + f.n + ' ' + f.cat + '*', cap(fLong(f.date)), ''];

/* ---------- state changes ---------- */
function saveDraft() {
  try {
    var s = JSON.stringify(work);

    else localStorage.setItem(DRAFT_KEY, JSON.stringify({ base: HASH, data: s, at: Date.now() }));
  } catch (e) {}
}

  try {

    var dr = JSON.parse(raw);
    if (!dr || !dr.data || dr.data === SAVED_STR) { localStorage.removeItem(DRAFT_KEY); return; }
    if (dr.base === HASH) { work = JSON.parse(dr.data); ui.notice = 'Recuperé cambios que no alcanzaste a guardar. Revisa y toca “Guardar y publicar”.'; }

}
function newId() { return 'j' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36); }

  if (!name) { toast('Escribe el nombre del jugador.'); return null; }
  if (work.players.some(function (p) { return norm(p.name) === norm(name); })) { toast(name + ' ya está en la lista.'); return null; }
  var p = { id: newId(), name: name, side: side || '' };
  work.players.push(p); saveDraft();
  return p;
}
function mkRows(n) { return range(1, n).map(function (pl) { return { pl: pl, p: ['', ''], a: [0, 0], n: ['', ''] }; }); }
function manFromResults(f) {
  var np = Math.max.apply(null, [12].concat((f.results || []).map(function (r) { return r.pl; })));
  return { np: np, rows: range(1, np).map(function (pl) {
    var rs = (f.results || []).filter(function (r) { return r.pl === pl; });
    return { pl: pl, p: [rs[0] ? rs[0].p : '', rs[1] ? rs[1].p : ''], a: [rs[0] ? rs[0].a : 0, rs[1] ? rs[1].a : 0], n: [rs[0] ? rs[0].n || '' : '', rs[1] ? rs[1].n || '' : ''] };
  }) };
}
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function act(a, el) {

  switch (a) {

    case 'rk-open': ui.open[v] = !ui.open[v]; break;
    case 'toggle-detail': ui.open['det' + ui.fecha] = !ui.open['det' + ui.fecha]; break;
    case 'goplayer': ui.tab = 'jugadores'; ui.player = v; ui.confirm = null; window.scrollTo(0, 0); break;
    case 'pback': ui.player = null; ui.confirm = null; break;
    case 'copy-rank': copy(rankText()); return;
    case 'copy-fecha': copy(fechaText(f)); return;
    case 'copy-json': copy(JSON.stringify(work, null, 1)); return;
    case 'copy-close': ui.copyText = null; break;
    case 'ask': ui.confirm = v; break;
    case 'cancel': ui.confirm = null; break;
    case 'notice-x': ui.notice = ''; break;
    case 'draft-restore': try { work = JSON.parse(ui.oldDraft.data); } catch (e) {} ui.oldDraft = null; saveDraft(); break;
    case 'draft-drop': ui.oldDraft = null; try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} break;
    case 'save': save(); return;
    case 'dl-web': downloadWeb(); return;
    case 'discard': work = JSON.parse(SAVED_STR); ui.confirm = null; try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} toast('Cambios descartados.'); return;
    case 'f-live': f.mode = 'vivo'; f.status = 'en juego'; f.live = { pairs: range(1, 12).map(function () { return ['', '']; }), sc: {}, ex: {} }; ui.sub[f.n] = 'parejas'; saveDraft(); break;
    case 'f-manual': f.mode = 'manual'; f.status = 'en juego'; f.man = { np: 12, rows: mkRows(12) }; saveDraft(); break;
    case 'f-reset': delete f.live; delete f.man; delete f.results; delete f.mode; delete f.imp; f.status = 'pendiente'; ui.confirm = null; saveDraft(); break;
    case 'f-reopen': f.status = 'en juego'; if (f.mode !== 'vivo') { f.mode = 'manual'; f.man = manFromResults(f); } ui.sub[f.n] = f.mode === 'vivo' ? 'cierre' : undefined; ui.confirm = null; saveDraft(); break;
    case 'f-close': {
      var rows = f.mode === 'vivo' ? liveResults(f, work, liveCompute(f)).map(function (r) { return { p: r.p, pl: r.pl, b: r.b, a: r.a, n: r.n }; }) : manualResults(f, work);
      if (!rows.length) { ui.confirm = null; toast('No hay jugadores con puesto para sumar.'); return; }
      f.results = rows; f.status = 'cerrada'; if (f.mode !== 'vivo') delete f.man;
      ui.confirm = null; saveDraft(); toast('Fecha cerrada. Toca “Guardar y publicar” para actualizar el ranking.'); return;
    }
    case 'draw': {

    }
    case 'quick-add': { var np = addPlayer(ui.quick); if (np) { ui.quick = ''; toast(np.name + ' agregado. Ya puedes elegirlo.'); return; } return; }
    case 'padd': { var p2 = addPlayer(ui.newName, ui.newSide); if (p2) { ui.newName = ''; ui.newSide = ''; toast(p2.name + ' agregado.'); return; } return; }
    case 'pdel': work.players = work.players.filter(function (p) { return p.id !== ui.player; }); ui.player = null; ui.confirm = null; saveDraft(); break;
    case 'fadd': {

  }

}

function onField(el) {
  var k = el.getAttribute('data-f');
  if (k.indexOf('ui:') === 0) { ui[k.slice(3)] = el.value; render(); return; }
  var f = ui.fecha != null ? getF(work, ui.fecha) : null;
  var val = el.value;
  switch (k) {
    case 'fcat': { var ff = getF(work, Number(el.getAttribute('data-n'))); if (ff && ff.status !== 'cerrada') ff.cat = val; break; }
    case 'cdate': { var fd = getF(work, Number(el.getAttribute('data-n'))); if (fd && /^\d{4}-\d{2}-\d{2}$/.test(val)) fd.date = val; break; }
    case 'pair': f.live.pairs[+el.getAttribute('data-i')][+el.getAttribute('data-j')] = val; break;
    case 'sc': {
      var L = f.live, id = el.getAttribute('data-id'), side = el.getAttribute('data-s'), pa = +el.getAttribute('data-pa'), pb = +el.getAttribute('data-pb');
      var s = L.sc[id];
      if (!s || s.pa !== pa || s.pb !== pb) s = L.sc[id] = { pa: pa, pb: pb };
      s[side] = val === '' ? '' : Math.max(0, Math.round(Number(val)));
      if (num(s.a) == null || num(s.a) !== num(s.b)) { delete s.ta; delete s.tb; }
      if (['a', 'b', 'ta', 'tb'].every(function (x) { return s[x] === '' || s[x] == null; })) delete L.sc[id];
      break;
    }
    case 'ex': {
      var ex = f.live.ex || (f.live.ex = {}), pid = el.getAttribute('data-pid'), o = ex[pid] || (ex[pid] = {});
      if (el.getAttribute('data-s') === 'v') o.v = val === '' ? '' : Math.round(Number(val)); else o.n = val;
      if ((o.v === '' || o.v == null || o.v === 0) && !o.n) delete ex[pid];
      break;
    }
    case 'np': {
      var M = f.man, n = Number(val);
      if (n > M.rows.length) M.rows = M.rows.concat(mkRows(n).slice(M.rows.length));
      else M.rows = M.rows.slice(0, n);
      M.np = n; break;
    }
    case 'mp': f.man.rows[+el.getAttribute('data-i')].p[+el.getAttribute('data-j')] = val; break;
    case 'ma': f.man.rows[+el.getAttribute('data-i')].a[+el.getAttribute('data-j')] = val === '' ? 0 : Math.round(Number(val)) || 0; break;
    case 'mn': f.man.rows[+el.getAttribute('data-i')].n[+el.getAttribute('data-j')] = val; break;
    case 'pname': { var p = PM.get(el.getAttribute('data-id')); if (p && val.trim()) p.name = val; break; }

    case 'setn': { var path2 = el.getAttribute('data-k').split('.'); if (val !== '') work[path2[0]][path2[1]] = Math.max(0, Math.round(Number(val)) || 0); break; }
    case 'tbl': if (val !== '') work.tables[el.getAttribute('data-c')][+el.getAttribute('data-i')] = Math.max(0, Math.round(Number(val)) || 0); break;
    default: return;
  }
  saveDraft(); render();
}

/* ---------- rendering ---------- */
var app = document.getElementById('app');
function morphChildren(from, to) {

  for (var i = 0; i < tc.length; i++) { if (i < fc.length) morph(fc[i], tc[i]); else from.appendChild(tc[i]); }
  for (var j = tc.length; j < fc.length; j++) fc[j].remove();
}
function morph(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName || (a.nodeType === 1 && (a.getAttribute('data-k') || '') !== (b.getAttribute('data-k') || ''))) { a.replaceWith(b); return; }
  if (a.nodeType !== 1) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  for (var i = a.attributes.length - 1; i >= 0; i--) { var n = a.attributes[i].name; if (!b.hasAttribute(n)) a.removeAttribute(n); }
  for (var k = 0; k < b.attributes.length; k++) { var at = b.attributes[k]; if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value); }
  if (a.nodeName === 'TEXTAREA') { if (a.value !== b.textContent) a.value = b.textContent; return; }
  morphChildren(a, b);
  if (a.nodeName === 'INPUT') { var v = b.getAttribute('value') || ''; if (a !== document.activeElement && a.value !== v) a.value = v; }
  if (a.nodeName === 'SELECT') { var sv = b.getAttribute('data-v') || ''; if (a.value !== sv) a.value = sv; }
}
function render() {

  if (!app.firstChild) app.appendChild(tpl.content);

});

render();
if (ui.scroll) { var sy = ui.scroll; delete ui.scroll; requestAnimationFrame(function () { window.scrollTo(0, sy); }); }

try {
  var hot = window.claude && window.claude.hot;
  if (hot) {
    if (typeof hot.snapshot === 'function') hot.snapshot(function () { return { ui: uiPersist() }; });
    var applyHot = function (d) { if (d && d.ui) { Object.assign(ui, d.ui); delete ui.scroll; render(); } };
    if (typeof hot.ready === 'function') hot.ready(applyHot); else applyHot(hot.data);
  }
} catch (e) {}

(function initEdit() {
  try {
    var c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    Promise.all([c.use('artifact'), c.use('user')]).then(function (res) {
      var art = res[0], usr = res[1];
      if (!art || !usr) return null;
      return usr.canEdit().then(function (ok) {
        if (!ok) return;
        artifactNS = art; canEdit = true; loadDraft(); render();
        c.use('downloads').then(function (d) { DL = d || null; render(); }, function () {});
      });
    }).catch(function () {});
  } catch (e) {}
})();
})();
</script>
